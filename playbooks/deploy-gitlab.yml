---
- name: Deploy GitLab with ACM TLS and Red Hat IdM authentication
  hosts: gitlab
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1

  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    AWS_DEFAULT_REGION: "{{ aws_region }}"

  tasks:
    - name: Install GitLab and bootstrap administrators
      ansible.builtin.include_role:
        name: deploy_gitlab
        apply:
          tags:
            - deploy_gitlab
      tags:
        - always
        - deploy_gitlab

    - name: Create and seed GitLab project content
      ansible.builtin.include_role:
        name: gitlab_content_bootstrap
        apply:
          tags:
            - gitlab_content_bootstrap
      tags:
        - always
        - gitlab_content_bootstrap

    - name: Bootstrap developers and configure project access
      ansible.builtin.include_role:
        name: deploy_gitlab
        tasks_from: post_content_bootstrap.yml
        apply:
          tags:
            - deploy_gitlab_post_content
      tags:
        - always
        - deploy_gitlab_post_content

    - name: Patch GitLab group and project visibility
      ansible.builtin.include_role:
        name: patch_gitlab_group_visibility
        apply:
          tags:
            - patch_gitlab_group_visibility
      tags:
        - always
        - patch_gitlab_group_visibility
