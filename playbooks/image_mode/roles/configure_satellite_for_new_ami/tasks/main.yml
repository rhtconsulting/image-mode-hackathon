---
###############################################################################
# Configure Satellite for a newly built AWS AMI
###############################################################################

###############################################################################
# PHASE 0 | Resolve operating system from Image Builder
###############################################################################

###############################################################################
# PHASE 0 | Resolve AMI workflow artifacts
###############################################################################

- name: PHASE 0 | Resolve AMI ID from workflow artifacts
  ansible.builtin.set_fact:
    configure_satellite_ami_resolved_id: >-
      {{
        configure_satellite_ami_id
        | default('', true)
        | trim
        if (
          configure_satellite_ami_id
          | default('', true)
          | trim
          | length > 0
        )
        else (
          image_mode_ami_id
          | default('', true)
          | trim
          if (
            image_mode_ami_id
            | default('', true)
            | trim
            | length > 0
          )
          else (
            image_mode_ami_result.ami_id
            | default('', true)
            | trim
          )
        )
      }}

- name: PHASE 0 | Resolve AMI architecture from workflow artifacts
  ansible.builtin.set_fact:
    configure_satellite_ami_resolved_architecture: >-
      {{
        configure_satellite_ami_architecture
        | default('', true)
        | trim
        if (
          configure_satellite_ami_architecture
          | default('', true)
          | trim
          | length > 0
        )
        else (
          image_mode_ami_result.architecture
          | default('x86_64', true)
          | trim
        )
      }}

- name: PHASE 0 | Promote resolved AMI workflow values
  ansible.builtin.set_fact:
    configure_satellite_ami_id: >-
      {{ configure_satellite_ami_resolved_id }}
    configure_satellite_ami_architecture: >-
      {{ configure_satellite_ami_resolved_architecture }}

- name: PHASE 0 | Display received AMI workflow artifacts
  ansible.builtin.debug:
    msg:
      configure_satellite_ami_id_input: >-
        {{
          configure_satellite_ami_id
          | default('UNDEFINED', true)
        }}
      image_mode_ami_id: >-
        {{
          image_mode_ami_id
          | default('UNDEFINED', true)
        }}
      image_mode_ami_result: >-
        {{
          image_mode_ami_result
          | default('UNDEFINED', true)
        }}
      image_mode_ami_result_ami_id: >-
        {{
          image_mode_ami_result.ami_id
          | default('UNDEFINED', true)
        }}
      resolved_ami_id: >-
        {{
          configure_satellite_ami_resolved_id
          | default('UNDEFINED', true)
        }}
      resolved_architecture: >-
        {{
          configure_satellite_ami_resolved_architecture
          | default('UNDEFINED', true)
        }}

- name: PHASE 0 | Validate received AMI workflow artifact
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_id | default('', true) | length > 0
      - >-
        configure_satellite_ami_id
        is match('^ami-[0-9a-fA-F]{8,17}$')
    fail_msg: >-
      No valid AMI ID was received from the preceding workflow job. The role
      checked configure_satellite_ami_id, image_mode_ami_id, and
      image_mode_ami_result.ami_id. Resolved value:
      {{ configure_satellite_ami_id | default('undefined', true) }}.

- name: PHASE 0 | Resolve Image Builder inventory hosts
  ansible.builtin.set_fact:
    configure_satellite_ami_builder_hosts: >-
      {{
        query(
          'inventory_hostnames',
          configure_satellite_ami_builder_pattern
          | default('image-builder*')
        )
      }}

- name: PHASE 0 | Select first Image Builder host
  ansible.builtin.set_fact:
    configure_satellite_ami_selected_builder: >-
      {{
        configure_satellite_ami_builder_hosts
        | first
        | default('', true)
      }}

- name: PHASE 0 | Validate selected Image Builder host
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_selected_builder | length > 0
      - configure_satellite_ami_selected_builder in hostvars
    fail_msg: >-
      No Image Builder host was found using inventory pattern
      {{
        configure_satellite_ami_builder_pattern
        | default('image-builder*')
      }}.
      Matching hosts:
      {{ configure_satellite_ami_builder_hosts }}.
      Available inventory hosts:
      {{ hostvars.keys() | list | sort }}.

- name: PHASE 0 | Gather operating-system facts from Image Builder
  ansible.builtin.setup:
    gather_subset:
      - min
    filter:
      - ansible_distribution
      - ansible_distribution_major_version
      - ansible_distribution_version
  delegate_to: "{{ configure_satellite_ami_selected_builder }}"
  delegate_facts: true

- name: PHASE 0 | Validate Image Builder operating-system facts
  ansible.builtin.assert:
    that:
      - >-
        hostvars[configure_satellite_ami_selected_builder]
        ['ansible_distribution']
        | default('')
        == 'RedHat'
      - >-
        hostvars[configure_satellite_ami_selected_builder]
        ['ansible_distribution_major_version']
        | default('')
        | string
        | length > 0
      - >-
        hostvars[configure_satellite_ami_selected_builder]
        ['ansible_distribution_version']
        | default('')
        | string
        | length > 0
    fail_msg: >-
      Unable to determine the Red Hat Enterprise Linux version from Image
      Builder host {{ configure_satellite_ami_selected_builder }}.
      Distribution:
      {{
        hostvars[configure_satellite_ami_selected_builder]
        ['ansible_distribution']
        | default('undefined')
      }}.
      Major version:
      {{
        hostvars[configure_satellite_ami_selected_builder]
        ['ansible_distribution_major_version']
        | default('undefined')
      }}.
      Distribution version:
      {{
        hostvars[configure_satellite_ami_selected_builder]
        ['ansible_distribution_version']
        | default('undefined')
      }}.

- name: PHASE 0 | Calculate Image Builder RHEL version
  ansible.builtin.set_fact:
    configure_satellite_ami_builder_rhel_major: >-
      {{
        hostvars[configure_satellite_ami_selected_builder]
        ['ansible_distribution_major_version']
        | string
        | trim
      }}
    configure_satellite_ami_builder_rhel_version: >-
      {{
        hostvars[configure_satellite_ami_selected_builder]
        ['ansible_distribution_version']
        | string
        | trim
      }}

- name: PHASE 0 | Calculate Satellite operating-system title
  ansible.builtin.set_fact:
    configure_satellite_ami_operating_system: >-
      RedHat {{ configure_satellite_ami_builder_rhel_version }}

- name: PHASE 0 | Display resolved Image Builder operating system
  ansible.builtin.debug:
    msg:
      - >-
        Image Builder inventory pattern:
        {{
          configure_satellite_ami_builder_pattern
          | default('image-builder*')
        }}
      - >-
        Matching Image Builder hosts:
        {{ configure_satellite_ami_builder_hosts }}
      - >-
        Selected Image Builder:
        {{ configure_satellite_ami_selected_builder }}
      - >-
        Detected distribution:
        {{
          hostvars[configure_satellite_ami_selected_builder]
          ['ansible_distribution']
        }}
      - >-
        Detected RHEL major version:
        {{ configure_satellite_ami_builder_rhel_major }}
      - >-
        Detected RHEL version:
        {{ configure_satellite_ami_builder_rhel_version }}
      - >-
        Satellite operating-system title:
        {{ configure_satellite_ami_operating_system }}

###############################################################################
# PHASE 1 | Validate inputs and Satellite
###############################################################################

- name: PHASE 1 | Validate required AMI configuration
  ansible.builtin.assert:
    that:
      - >-
        configure_satellite_ami_compute_resource_name
        | default('', true)
        | trim
        | length > 0
      - >-
        configure_satellite_ami_organization_label
        | default('', true)
        | trim
        | length > 0
      - >-
        configure_satellite_ami_image_name
        | default('', true)
        | trim
        | length > 0
      - >-
        configure_satellite_ami_username
        | default('', true)
        | trim
        | length > 0
      - >-
        configure_satellite_ami_architecture
        | default('', true)
        | trim
        | length > 0
      - >-
        configure_satellite_ami_operating_system
        | default('', true)
        | trim
        | length > 0
      - >-
        configure_satellite_ami_id
        is match('^ami-[0-9a-fA-F]{8,17}$')
    fail_msg: >-
      Satellite AMI configuration requires a compute-resource name,
      organization label, image name, username, architecture, exact Satellite
      operating-system title, and valid AWS AMI ID. Received AMI:
      {{ configure_satellite_ami_id | default('undefined', true) }}.
    success_msg: >-
      Configuring Satellite image
      {{ configure_satellite_ami_image_name }}
      with AMI {{ configure_satellite_ami_id }}.

- name: PHASE 1 | Verify Hammer CLI
  ansible.builtin.command:
    argv:
      - hammer
      - --version
  register: configure_satellite_ami_hammer_version
  changed_when: false

- name: PHASE 1 | Verify Satellite services
  ansible.builtin.command:
    argv:
      - satellite-maintain
      - service
      - status
  register: configure_satellite_ami_service_status
  changed_when: false

###############################################################################
# PHASE 2 | Resolve organization and compute resource
###############################################################################

- name: PHASE 2 | List Satellite organizations
  ansible.builtin.command:
    argv:
      - hammer
      - --output
      - json
      - organization
      - list
      - --per-page
      - "1000"
  register: configure_satellite_ami_organization_lookup
  changed_when: false

- name: PHASE 2 | Select Satellite organization
  ansible.builtin.set_fact:
    configure_satellite_ami_organizations: >-
      {{
        (
          configure_satellite_ami_organization_lookup.stdout
          | from_json
        )
        | selectattr(
            'Label',
            'equalto',
            configure_satellite_ami_organization_label | trim
          )
        | list
      }}

- name: PHASE 2 | Validate Satellite organization
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_organizations | length == 1
    fail_msg: >-
      Unable to uniquely resolve Satellite organization label
      {{ configure_satellite_ami_organization_label }}.

- name: PHASE 2 | List Satellite compute resources
  ansible.builtin.command:
    argv:
      - hammer
      - --output
      - json
      - compute-resource
      - list
      - --per-page
      - "1000"
  register: configure_satellite_ami_compute_resource_lookup
  changed_when: false

- name: PHASE 2 | Parse Satellite compute resources
  ansible.builtin.set_fact:
    configure_satellite_ami_all_compute_resources: >-
      {{
        configure_satellite_ami_compute_resource_lookup.stdout
        | from_json
      }}

- name: PHASE 2 | Select AWS compute resource
  ansible.builtin.set_fact:
    configure_satellite_ami_compute_resources: >-
      {{
        configure_satellite_ami_all_compute_resources
        | selectattr(
            'Name',
            'equalto',
            configure_satellite_ami_compute_resource_name | trim
          )
        | list
      }}

- name: PHASE 2 | Validate AWS compute resource
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_compute_resources | length == 1
    fail_msg: >-
      Unable to uniquely resolve Satellite compute resource
      {{ configure_satellite_ami_compute_resource_name }}.
      Available compute resources:
      {{
        configure_satellite_ami_all_compute_resources
        | map(attribute='Name')
        | list
      }}.

- name: PHASE 2 | Set compute-resource ID
  ansible.builtin.set_fact:
    configure_satellite_ami_compute_resource_id: >-
      {{
        configure_satellite_ami_compute_resources[0]['Id']
      }}

###############################################################################
# PHASE 3 | Resolve architecture
###############################################################################

- name: PHASE 3 | List Satellite architectures
  ansible.builtin.command:
    argv:
      - hammer
      - --output
      - json
      - architecture
      - list
      - --per-page
      - "1000"
  register: configure_satellite_ami_architecture_lookup
  changed_when: false

- name: PHASE 3 | Parse Satellite architectures
  ansible.builtin.set_fact:
    configure_satellite_ami_all_architectures: >-
      {{
        configure_satellite_ami_architecture_lookup.stdout
        | from_json
      }}

- name: PHASE 3 | Select Satellite architecture
  ansible.builtin.set_fact:
    configure_satellite_ami_architectures: >-
      {{
        configure_satellite_ami_all_architectures
        | selectattr(
            'Name',
            'equalto',
            configure_satellite_ami_architecture | trim
          )
        | list
      }}

- name: PHASE 3 | Validate Satellite architecture
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_architectures | length == 1
    fail_msg: >-
      Unable to uniquely resolve Satellite architecture
      {{ configure_satellite_ami_architecture }}.
      Available architectures:
      {{
        configure_satellite_ami_all_architectures
        | map(attribute='Name')
        | list
      }}.

- name: PHASE 3 | Set architecture ID
  ansible.builtin.set_fact:
    configure_satellite_ami_architecture_id: >-
      {{
        configure_satellite_ami_architectures[0]['Id']
      }}

###############################################################################
# PHASE 4 | Resolve operating system
###############################################################################

- name: PHASE 4 | List Satellite operating systems
  ansible.builtin.command:
    argv:
      - hammer
      - --output
      - json
      - os
      - list
      - --per-page
      - "1000"
  register: configure_satellite_ami_operating_system_lookup
  changed_when: false

- name: PHASE 4 | Parse Satellite operating systems
  ansible.builtin.set_fact:
    configure_satellite_ami_all_operating_systems: >-
      {{
        configure_satellite_ami_operating_system_lookup.stdout
        | from_json
      }}

- name: PHASE 4 | Select Satellite operating system
  ansible.builtin.set_fact:
    configure_satellite_ami_matching_operating_systems: >-
      {{
        configure_satellite_ami_all_operating_systems
        | selectattr(
            'Title',
            'equalto',
            configure_satellite_ami_operating_system | trim
          )
        | list
      }}

- name: PHASE 4 | Validate Satellite operating system
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_matching_operating_systems | length == 1
    fail_msg: >-
      Unable to uniquely resolve Satellite operating system
      {{ configure_satellite_ami_operating_system }}.
      Available operating systems:
      {{
        configure_satellite_ami_all_operating_systems
        | map(attribute='Title')
        | list
      }}.

- name: PHASE 4 | Set operating-system facts
  ansible.builtin.set_fact:
    configure_satellite_ami_operating_system_id: >-
      {{
        configure_satellite_ami_matching_operating_systems[0]['Id']
      }}
    configure_satellite_ami_operating_system_title: >-
      {{
        configure_satellite_ami_matching_operating_systems[0]['Title']
      }}

###############################################################################
# PHASE 5 | Verify AMI visibility
###############################################################################

- name: PHASE 5 | List AWS images visible to Satellite
  ansible.builtin.command:
    argv:
      - hammer
      - --output
      - json
      - compute-resource
      - image
      - available
      - --compute-resource-id
      - "{{ configure_satellite_ami_compute_resource_id }}"
      - --organization-label
      - "{{ configure_satellite_ami_organization_label }}"
  register: configure_satellite_ami_available_images_lookup
  changed_when: false

- name: PHASE 5 | Select requested AWS AMI
  ansible.builtin.set_fact:
    configure_satellite_ami_available_matches: >-
      {{
        (
          configure_satellite_ami_available_images_lookup.stdout
          | from_json
        )
        | selectattr(
            'Uuid',
            'equalto',
            configure_satellite_ami_id
          )
        | list
      }}

- name: PHASE 5 | Validate AMI visibility
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_available_matches | length == 1
    fail_msg: >-
      AMI {{ configure_satellite_ami_id }} is not visible through compute
      resource {{ configure_satellite_ami_compute_resource_name }}. Verify the
      AWS account, region, AMI status, architecture, and IAM permissions.

###############################################################################
# PHASE 6 | Resolve existing Satellite image
###############################################################################

- name: PHASE 6 | List Satellite compute-resource images
  ansible.builtin.command:
    argv:
      - hammer
      - --output
      - json
      - compute-resource
      - image
      - list
      - --compute-resource-id
      - "{{ configure_satellite_ami_compute_resource_id }}"
      - --organization-label
      - "{{ configure_satellite_ami_organization_label }}"
      - --per-page
      - "1000"
  register: configure_satellite_ami_existing_image_lookup
  changed_when: false

- name: PHASE 6 | Parse Satellite compute-resource images
  ansible.builtin.set_fact:
    configure_satellite_ami_all_existing_images: >-
      {{
        configure_satellite_ami_existing_image_lookup.stdout
        | from_json
      }}

- name: PHASE 6 | Select existing Satellite image
  ansible.builtin.set_fact:
    configure_satellite_ami_existing_images: >-
      {{
        configure_satellite_ami_all_existing_images
        | selectattr(
            'Name',
            'equalto',
            configure_satellite_ami_image_name | trim
          )
        | list
      }}

- name: PHASE 6 | Validate existing image uniqueness
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_existing_images | length <= 1
    fail_msg: >-
      More than one Satellite image named
      {{ configure_satellite_ami_image_name }} exists under compute resource
      {{ configure_satellite_ami_compute_resource_name }}.

###############################################################################
# PHASE 7 | Create or update Satellite image
###############################################################################

- name: PHASE 7 | Create Satellite image
  ansible.builtin.command:
    argv:
      - hammer
      - compute-resource
      - image
      - create
      - --compute-resource-id
      - "{{ configure_satellite_ami_compute_resource_id }}"
      - --name
      - "{{ configure_satellite_ami_image_name }}"
      - --operatingsystem-id
      - "{{ configure_satellite_ami_operating_system_id }}"
      - --architecture-id
      - "{{ configure_satellite_ami_architecture_id }}"
      - --username
      - "{{ configure_satellite_ami_username }}"
      - --user-data
      - >-
        {{
          configure_satellite_ami_user_data
          | default(false)
          | bool
          | ternary('true', 'false')
        }}
      - --uuid
      - "{{ configure_satellite_ami_id }}"
      - --organization-label
      - "{{ configure_satellite_ami_organization_label }}"
  register: configure_satellite_ami_create_result
  changed_when: true
  when:
    - configure_satellite_ami_existing_images | length == 0

- name: PHASE 7 | Read existing Satellite image
  ansible.builtin.command:
    argv:
      - hammer
      - --output
      - json
      - compute-resource
      - image
      - info
      - --id
      - "{{ configure_satellite_ami_existing_images[0]['Id'] }}"
      - --compute-resource-id
      - "{{ configure_satellite_ami_compute_resource_id }}"
      - --organization-label
      - "{{ configure_satellite_ami_organization_label }}"
  register: configure_satellite_ami_existing_image_info
  changed_when: false
  when:
    - configure_satellite_ami_existing_images | length == 1

- name: PHASE 7 | Parse existing Satellite image
  ansible.builtin.set_fact:
    configure_satellite_ami_existing_image_details: >-
      {{
        configure_satellite_ami_existing_image_info.stdout
        | from_json
      }}
  when:
    - configure_satellite_ami_existing_images | length == 1

- name: PHASE 7 | Determine whether image update is required
  ansible.builtin.set_fact:
    configure_satellite_ami_update_required: >-
      {{
        (
          configure_satellite_ami_existing_image_details['Uuid']
          | default('')
        )
        != configure_satellite_ami_id
        or
        (
          configure_satellite_ami_existing_image_details['Username']
          | default('')
        )
        != configure_satellite_ami_username
        or
        (
          configure_satellite_ami_existing_image_details['Architecture']
          | default('')
        )
        != configure_satellite_ami_architecture
        or
        (
          configure_satellite_ami_existing_image_details['Operating system']
          | default('')
        )
        != configure_satellite_ami_operating_system_title
      }}
  when:
    - configure_satellite_ami_existing_images | length == 1

- name: PHASE 7 | Validate existing-image update permission
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_update_existing | default(true) | bool
    fail_msg: >-
      Satellite image {{ configure_satellite_ami_image_name }} exists but does
      not match AMI {{ configure_satellite_ami_id }}. Set
      configure_satellite_ami_update_existing=true to update it.
  when:
    - configure_satellite_ami_existing_images | length == 1
    - configure_satellite_ami_update_required | bool

- name: PHASE 7 | Update Satellite image
  ansible.builtin.command:
    argv:
      - hammer
      - compute-resource
      - image
      - update
      - --id
      - "{{ configure_satellite_ami_existing_images[0]['Id'] }}"
      - --compute-resource-id
      - "{{ configure_satellite_ami_compute_resource_id }}"
      - --name
      - "{{ configure_satellite_ami_image_name }}"
      - --operatingsystem-id
      - "{{ configure_satellite_ami_operating_system_id }}"
      - --architecture-id
      - "{{ configure_satellite_ami_architecture_id }}"
      - --username
      - "{{ configure_satellite_ami_username }}"
      - --user-data
      - >-
        {{
          configure_satellite_ami_user_data
          | default(false)
          | bool
          | ternary('true', 'false')
        }}
      - --uuid
      - "{{ configure_satellite_ami_id }}"
      - --organization-label
      - "{{ configure_satellite_ami_organization_label }}"
  register: configure_satellite_ami_update_result
  changed_when: true
  when:
    - configure_satellite_ami_existing_images | length == 1
    - configure_satellite_ami_update_required | bool
    - configure_satellite_ami_update_existing | default(true) | bool

###############################################################################
# PHASE 8 | Verify resulting Satellite image
###############################################################################

- name: PHASE 8 | List final Satellite images
  ansible.builtin.command:
    argv:
      - hammer
      - --output
      - json
      - compute-resource
      - image
      - list
      - --compute-resource-id
      - "{{ configure_satellite_ami_compute_resource_id }}"
      - --organization-label
      - "{{ configure_satellite_ami_organization_label }}"
      - --per-page
      - "1000"
  register: configure_satellite_ami_final_lookup
  changed_when: false

- name: PHASE 8 | Parse final Satellite images
  ansible.builtin.set_fact:
    configure_satellite_ami_all_final_images: >-
      {{
        configure_satellite_ami_final_lookup.stdout
        | from_json
      }}

- name: PHASE 8 | Select final Satellite image
  ansible.builtin.set_fact:
    configure_satellite_ami_final_images: >-
      {{
        configure_satellite_ami_all_final_images
        | selectattr(
            'Name',
            'equalto',
            configure_satellite_ami_image_name | trim
          )
        | list
      }}

- name: PHASE 8 | Validate final Satellite image
  ansible.builtin.assert:
    that:
      - configure_satellite_ami_final_images | length == 1
      - >-
        configure_satellite_ami_final_images[0]['Uuid']
        == configure_satellite_ami_id
    fail_msg: >-
      Satellite image {{ configure_satellite_ami_image_name }} was not
      configured with AMI {{ configure_satellite_ami_id }}.

- name: PHASE 8 | Display configured Satellite image
  ansible.builtin.debug:
    msg:
      - "Satellite image: {{ configure_satellite_ami_image_name }}"
      - "Compute resource: {{ configure_satellite_ami_compute_resource_name }}"
      - "Compute resource ID: {{ configure_satellite_ami_compute_resource_id }}"
      - "AMI ID: {{ configure_satellite_ami_id }}"
      - "Operating system: {{ configure_satellite_ami_operating_system_title }}"
      - "Architecture: {{ configure_satellite_ami_architecture }}"
      - "Username: {{ configure_satellite_ami_username }}"