---
controller_credential_types:
  ###########################################################################
  # Red Hat Registry
  ###########################################################################

  - name: Red Hat Registry Credential
    description: >-
      Injects registry.redhat.io credentials for RHEL Image Mode builds.
    kind: cloud

    inputs:
      fields:
        - id: redhat_registry_host
          type: string
          label: Red Hat Registry Host

        - id: redhat_registry_username
          type: string
          label: Red Hat Registry Username

        - id: redhat_registry_password
          type: string
          label: Red Hat Registry Password
          secret: true

      required:
        - redhat_registry_host
        - redhat_registry_username
        - redhat_registry_password

    injectors:
      extra_vars:
        redhat_registry_host: "{  { redhat_registry_host }}"
        redhat_registry_username: "{  { redhat_registry_username }}"
        redhat_registry_password: "{  { redhat_registry_password }}"

  ###########################################################################
  # Quay Registry
  ###########################################################################

  - name: Quay Registry Credential
    description: >-
      Injects Quay registry credentials for Image Mode image publishing
      and deployment.
    kind: cloud

    inputs:
      fields:
        - id: quay_registry_host
          type: string
          label: Quay Registry Host

        - id: quay_registry_username
          type: string
          label: Quay Registry Username

        - id: quay_registry_password
          type: string
          label: Quay Registry Password
          secret: true

      required:
        - quay_registry_host
        - quay_registry_username
        - quay_registry_password

    injectors:
      extra_vars:
        quay_registry_host: "{  { quay_registry_host }}"
        quay_registry_username: "{  { quay_registry_username }}"
        quay_registry_password: "{  { quay_registry_password }}"

  ###########################################################################
  # Red Hat Identity Management administrator
  ###########################################################################

  - name: IdM Administrator Credential
    description: >-
      Injects the Red Hat Identity Management administrator principal and
      password for IdM and FreeIPA administration tasks.
    kind: cloud

    inputs:
      fields:
        - id: idm_admin_username
          type: string
          label: IdM Administrator Username
          help_text: >-
            IdM administrative principal, normally admin.

        - id: idm_admin_password
          type: string
          label: IdM Administrator Password
          secret: true

      required:
        - idm_admin_username
        - idm_admin_password

    injectors:
      extra_vars:
        idm_admin_username: "{  { idm_admin_username }}"
        idm_admin_password: "{  { idm_admin_password }}"
        ipaadmin_principal: "{  { idm_admin_username }}"
        ipaadmin_password: "{  { idm_admin_password }}"

  ###########################################################################
  # AWS IAM service account
  ###########################################################################

  - name: AWS IAM Service Account Credential
    description: >-
      Injects AWS IAM service-account credentials used by Image Mode
      automation to access Amazon S3, initiate VM Import/Export operations,
      inspect AMI import tasks, and perform other approved AWS API actions.
    kind: cloud

    inputs:
      fields:
        - id: aws_access_key_id
          type: string
          label: AWS Access Key ID
          help_text: >-
            Access-key ID belonging to the Terraform-created Image Mode
            automation IAM user.

        - id: aws_secret_access_key
          type: string
          label: AWS Secret Access Key
          secret: true
          help_text: >-
            Secret access key belonging to the Terraform-created Image Mode
            automation IAM user.

        - id: aws_region
          type: string
          label: AWS Region
          help_text: >-
            Default AWS region used by Image Mode automation.

      required:
        - aws_access_key_id
        - aws_secret_access_key
        - aws_region

    injectors:
      env:
        AWS_ACCESS_KEY_ID: "{  { aws_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{  { aws_secret_access_key }}"
        AWS_REGION: "{  { aws_region }}"
        AWS_DEFAULT_REGION: "{  { aws_region }}"

      extra_vars:
        aws_access_key_id: "{  { aws_access_key_id }}"
        aws_secret_access_key: "{  { aws_secret_access_key }}"
        aws_region: "{  { aws_region }}"
        aws_default_region: "{  { aws_region }}"

  ###########################################################################
  # AMI SSH public key
  ###########################################################################

  - name: Image Mode AMI SSH Public Key Credential
    description: >-
      Inject the Terraform-generated SSH public key into Image Mode AMI build
      jobs. The public key is derived from the Terraform private key during
      AAP CaaC configuration. The private key remains managed separately by
      the Image Mode Machine Credential.
    kind: cloud

    inputs:
      fields:
        - id: image_mode_ssh_public_key
          type: string
          label: AMI SSH public key
          help_text: >-
            OpenSSH public key installed for ec2-user in generated Image Mode
            AMIs.
          multiline: true
          secret: true

      required:
        - image_mode_ssh_public_key

    injectors:
      extra_vars:
        image_mode_ssh_public_key: "{  { image_mode_ssh_public_key }}"