---
###############################################################################
# Repair GitLab group settings and configure visibility
###############################################################################

###############################################################################
# Validate role variables
###############################################################################

- name: GITLAB GROUP | Validate role variables
  ansible.builtin.assert:
    that:
      - gitlab_group_visibility_group_path is string
      - gitlab_group_visibility_group_path | trim | length > 0
      - gitlab_group_visibility_level in ['private', 'internal', 'public']
      - gitlab_group_visibility_rails_runner_path is string
      - gitlab_group_visibility_rails_runner_path | trim | length > 0
      - gitlab_group_visibility_script_directory is string
      - gitlab_group_visibility_script_directory | trim | length > 0
      - gitlab_group_visibility_script_path is string
      - gitlab_group_visibility_script_path | trim | length > 0
      - gitlab_group_visibility_script_owner is string
      - gitlab_group_visibility_script_owner | trim | length > 0
      - gitlab_group_visibility_script_group is string
      - gitlab_group_visibility_script_group | trim | length > 0
    fail_msg: >-
      GitLab group visibility role variables are invalid. The group path must
      be non-empty, the visibility level must be private, internal, or public,
      and the temporary script settings must be defined.

###############################################################################
# Validate GitLab installation
###############################################################################

- name: GITLAB GROUP | Check GitLab Rails runner
  ansible.builtin.stat:
    path: "{{ gitlab_group_visibility_rails_runner_path }}"
  register: gitlab_group_visibility_rails_runner_status

- name: GITLAB GROUP | Validate GitLab Rails runner
  ansible.builtin.assert:
    that:
      - gitlab_group_visibility_rails_runner_status.stat.exists
      - gitlab_group_visibility_rails_runner_status.stat.isreg
      - gitlab_group_visibility_rails_runner_status.stat.executable
    fail_msg: >-
      GitLab Rails runner was not found or is not executable at
      {{ gitlab_group_visibility_rails_runner_path }}.

###############################################################################
# Validate GitLab service account
###############################################################################

- name: GITLAB GROUP | Read GitLab service account
  ansible.builtin.getent:
    database: passwd
    key: "{{ gitlab_group_visibility_script_owner }}"

- name: GITLAB GROUP | Validate GitLab service account
  ansible.builtin.assert:
    that:
      - >-
        gitlab_group_visibility_script_owner in
        ansible_facts.getent_passwd
    fail_msg: >-
      GitLab service account
      {{ gitlab_group_visibility_script_owner }} does not exist.

###############################################################################
# Optional GitLab backup
###############################################################################

- name: GITLAB GROUP | Create GitLab backup
  ansible.builtin.command:
    argv:
      - gitlab-backup
      - create
  when: gitlab_group_visibility_create_backup | bool
  register: gitlab_group_visibility_backup
  changed_when: true

###############################################################################
# Prepare temporary Rails script directory
###############################################################################

- name: GITLAB GROUP | Ensure temporary Rails script directory exists
  ansible.builtin.file:
    path: "{{ gitlab_group_visibility_script_directory }}"
    state: directory
    owner: "{{ gitlab_group_visibility_script_owner }}"
    group: "{{ gitlab_group_visibility_script_group }}"
    mode: "0700"

###############################################################################
# Stage Rails configuration script
###############################################################################

- name: GITLAB GROUP | Install temporary Rails configuration script
  ansible.builtin.template:
    src: configure_group_visibility.rb.j2
    dest: "{{ gitlab_group_visibility_script_path }}"
    owner: "{{ gitlab_group_visibility_script_owner }}"
    group: "{{ gitlab_group_visibility_script_group }}"
    mode: "{{ gitlab_group_visibility_script_mode }}"
  register: gitlab_group_visibility_script

- name: GITLAB GROUP | Inspect temporary Rails configuration script
  ansible.builtin.stat:
    path: "{{ gitlab_group_visibility_script_path }}"
  register: gitlab_group_visibility_script_status

- name: GITLAB GROUP | Validate temporary Rails configuration script
  ansible.builtin.assert:
    that:
      - gitlab_group_visibility_script_status.stat.exists
      - gitlab_group_visibility_script_status.stat.isreg
      - >-
        gitlab_group_visibility_script_status.stat.pw_name ==
        gitlab_group_visibility_script_owner
      - >-
        gitlab_group_visibility_script_status.stat.gr_name ==
        gitlab_group_visibility_script_group
      - gitlab_group_visibility_script_status.stat.readable
    fail_msg: >-
      The temporary Rails configuration script was not created with the
      expected ownership or permissions at
      {{ gitlab_group_visibility_script_path }}.

- name: GITLAB GROUP | Verify script is readable by GitLab user
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - -r
      - "{{ gitlab_group_visibility_script_path }}"
  become: true
  become_user: "{{ gitlab_group_visibility_script_owner }}"
  changed_when: false

###############################################################################
# Execute Rails configuration script
###############################################################################

- name: GITLAB GROUP | Repair group settings and configure visibility
  ansible.builtin.command:
    argv:
      - "{{ gitlab_group_visibility_rails_runner_path }}"
      - runner
      - "{{ gitlab_group_visibility_script_path }}"
  register: gitlab_group_visibility_result
  changed_when: >-
    'ANSIBLE_CHANGED=true' in
    gitlab_group_visibility_result.stdout
  failed_when:
    - gitlab_group_visibility_result.rc != 0

###############################################################################
# Display command output
###############################################################################

- name: GITLAB GROUP | Display configuration result
  ansible.builtin.debug:
    var: gitlab_group_visibility_result.stdout_lines

- name: GITLAB GROUP | Display configuration errors
  ansible.builtin.debug:
    var: gitlab_group_visibility_result.stderr_lines
  when:
    - gitlab_group_visibility_result.stderr is defined
    - gitlab_group_visibility_result.stderr | length > 0

###############################################################################
# Verify final GitLab configuration
###############################################################################

- name: GITLAB GROUP | Verify namespace settings and visibility
  ansible.builtin.assert:
    that:
      - >-
        (
          'GITLAB_GROUP_FINAL_VISIBILITY=' ~
          gitlab_group_visibility_level
        ) in gitlab_group_visibility_result.stdout
      - >-
        'GITLAB_NAMESPACE_SETTINGS_ID=' in
        gitlab_group_visibility_result.stdout
    fail_msg: >-
      GitLab group configuration completed without returning the expected
      verification markers.
    success_msg: >-
      GitLab group {{ gitlab_group_visibility_group_path }} has a valid
      namespace_settings record and is
      {{ gitlab_group_visibility_level }}.

###############################################################################
# Optional Puma restart
###############################################################################

- name: GITLAB GROUP | Restart GitLab Puma
  ansible.builtin.command:
    argv:
      - "{{ gitlab_group_visibility_service_command }}"
      - restart
      - puma
  when:
    - gitlab_group_visibility_restart_puma | bool
    - gitlab_group_visibility_result is changed
  changed_when: true

###############################################################################
# Cleanup
###############################################################################

- name: GITLAB GROUP | Remove temporary Rails configuration script
  ansible.builtin.file:
    path: "{{ gitlab_group_visibility_script_path }}"
    state: absent