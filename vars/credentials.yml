---
controller_credentials:
  ###########################################################################
  # Terraform-generated SSH machine credential
  ###########################################################################

  - name: Image Mode Machine Credential
    description: >-
      Terraform-generated SSH private key used to connect to AWS EC2 hosts
      over their VPC private addresses.
    organization: Image Mode Lab
    credential_type: Machine
    inputs:
      username: ec2-user
      ssh_key_data: "{{ image_mode_ssh_private_key }}"

  ###########################################################################
  # Git source control credential
  ###########################################################################

  - name: Git Credential
    description: >-
      Source control credentials for the Image Mode Git repository.
    organization: Image Mode Lab
    credential_type: Source Control
    inputs:
      username: "{{ git_username }}"
      password: "{{ git_token }}"

  ###########################################################################
  # Red Hat registry credential
  ###########################################################################

  - name: Image Mode Red Hat Registry Credential
    description: >-
      Registry credentials used to pull supported Red Hat container images.
    organization: Image Mode Lab
    credential_type: Red Hat Registry Credential
    inputs:
      redhat_registry_host: "{{ redhat_registry_host }}"
      redhat_registry_username: "{{ redhat_registry_username }}"
      redhat_registry_password: "{{ redhat_registry_password }}"

  ###########################################################################
  # Quay registry credential
  ###########################################################################

  - name: Image Mode Quay Registry Credential
    description: >-
      Dedicated LDAP registry credentials used to push and pull Image Mode
      container images from Quay.
    organization: Image Mode Lab
    credential_type: Quay Registry Credential
    inputs:
      quay_registry_host: "{{ resolved_quay_hostname }}"
      quay_registry_username: "{{ quay_registry_username }}"
      quay_registry_password: "{{ quay_registry_password }}"

  ###########################################################################
  # Red Hat Identity Management administrator credential
  ###########################################################################

  - name: Image Mode IdM Administrator Credential
    description: >-
      IdM administrator credentials retrieved from AWS Secrets Manager and
      injected into IdM administration job templates.
    organization: Image Mode Lab
    credential_type: IdM Administrator Credential
    inputs:
      idm_admin_username: "{{ idm_admin_username }}"
      idm_admin_password: "{{ idm_admin_password }}"

  ###########################################################################
  # AWS IAM service-account credential
  ###########################################################################

  - name: AWS IAM Service Account Credential
    description: >-
      Terraform-created AWS IAM service-account credentials used by Image
      Mode automation for S3 artifact access, bootc AMI imports, VM
      Import/Export task inspection, and approved AWS API operations.
    organization: Image Mode Lab
    credential_type: AWS IAM Service Account Credential
    inputs:
      image_mode_aws_access_key_id: >-
        {{ image_mode_aws_access_key_id }}
      image_mode_aws_secret_access_key: >-
        {{ image_mode_aws_secret_access_key }}
      image_mode_aws_region: >-
        {{ image_mode_aws_region }}

  ###########################################################################
  # Image Mode AMI SSH public key credential
  ###########################################################################

  - name: Image Mode AMI SSH Public Key Credential
    description: >-
      Terraform-generated SSH public key injected into Image Mode AMI builds
      for installation into the ec2-user authorized_keys configuration.
    organization: Image Mode Lab
    credential_type: Image Mode AMI SSH Public Key Credential
    inputs:
      image_mode_ssh_public_key: "{{ image_mode_ssh_public_key }}"

  ###########################################################################
  # Red Hat Identity Management non-administrator credential
  ###########################################################################

  - name: Image Mode IdM Non-Admin Credential
    description: >-
      Non-administrative IdM LDAP credential used by the Image Mode builder
      account.
    organization: Image Mode Lab
    credential_type: IdM Normal Credential
    inputs:
      idm_normal_username: "{{ idm_normal_username }}"
      idm_normal_password: "{{ idm_normal_password }}"

  ###########################################################################
  # Red Hat Satellite 6 credential
  ###########################################################################
  - name: Image Mode Satellite Credential
    description: >-
      Credential used by Automation Controller to synchronize managed hosts
      from Red Hat Satellite 6.
    organization: Image Mode Lab
    credential_type: Red Hat Satellite 6
    inputs:
      host: "{{ satellite_url }}"
      username: admin
      password: "{{ satellite_password }}"
    state: present

  ###########################################################################
  # Red Hat Ansible Automation Platform controller credential
  ###########################################################################

  - name: "Red Hat Ansible Controller Credential"
    description: >-
      Administrator credential used by workflow jobs to manage inventories,
      groups, hosts, and other configuration objects in the Image Mode
      Automation Controller.
    organization: "Image Mode Lab"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ controller_host }}"
      username: "{{ gateway_admin_username }}"
      password: "{{ gateway_admin_password }}"
      verify_ssl: false
      request_timeout: "30"
    state: present