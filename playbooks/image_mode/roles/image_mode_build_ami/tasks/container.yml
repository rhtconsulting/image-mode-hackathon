---
###############################################################################
# Build and publish the bootc container image
###############################################################################

###############################################################################
# Validate Image Builder operating system
###############################################################################

- name: IMAGE MODE AMI | Validate Image Builder operating system facts
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution is defined
      - ansible_facts.distribution_version is defined
      - ansible_facts.distribution_major_version is defined
      - ansible_facts.distribution == "RedHat"
      - ansible_facts.distribution_major_version in image_mode_base_images
    fail_msg: >-
      The Image Mode build requires a supported Red Hat Enterprise Linux
      builder host. Detected distribution={{
      ansible_facts.distribution | default('unknown') }}, version={{
      ansible_facts.distribution_version | default('unknown') }}.
      Supported RHEL major versions are
      {{ image_mode_base_images.keys() | list | join(', ') }}.

###############################################################################
# Detect Satellite release lock
###############################################################################

- name: IMAGE MODE AMI | Read Satellite release lock
  ansible.builtin.command:
    argv:
      - subscription-manager
      - release
      - --show
  register: image_mode_subscription_release
  changed_when: false
  failed_when: false

- name: IMAGE MODE AMI | Extract Satellite release
  ansible.builtin.set_fact:
    image_mode_satellite_release: >-
      {{
        image_mode_subscription_release.stdout
        | regex_search('[0-9]+(?:\.[0-9]+)+')
        | default('', true)
      }}

- name: IMAGE MODE AMI | Select effective RHEL release
  ansible.builtin.set_fact:
    image_mode_rhel_release: >-
      {{
        image_mode_rhel_release_override
        if image_mode_rhel_release_override | default('') | length > 0
        else (
          image_mode_satellite_release
          if image_mode_satellite_release | length > 0
          else ansible_facts.distribution_version
        )
      }}

- name: IMAGE MODE AMI | Determine RHEL major version
  ansible.builtin.set_fact:
    image_mode_rhel_major_version: >-
      {{
        image_mode_rhel_release
        | split('.')
        | first
      }}

- name: IMAGE MODE AMI | Validate detected release
  ansible.builtin.assert:
    that:
      - image_mode_rhel_release is match('^[0-9]+\\.[0-9]+$')
      - image_mode_rhel_major_version == ansible_facts.distribution_major_version
      - image_mode_rhel_major_version in image_mode_base_images
    fail_msg: >-
      Unable to determine a valid Satellite-managed RHEL release.
      Builder={{ ansible_facts.distribution_version }},
      Satellite={{ image_mode_subscription_release.stdout | trim }},
      Selected={{ image_mode_rhel_release }}.

###############################################################################
# Validate and repair Podman storage SELinux labels
###############################################################################

- name: IMAGE MODE AMI | Install SELinux container management packages
  ansible.builtin.dnf:
    name:
      - container-selinux
      - policycoreutils-python-utils
    state: present
  become: true

- name: IMAGE MODE AMI | Read Podman graph root
  ansible.builtin.command:
    argv:
      - podman
      - info
      - --format
      - "{{ '{{' }} .Store.GraphRoot {{ '}}' }}"
  register: image_mode_podman_graph_root
  changed_when: false
  become: true

- name: IMAGE MODE AMI | Store Podman graph-root path
  ansible.builtin.set_fact:
    image_mode_podman_graph_root_path: >-
      {{ image_mode_podman_graph_root.stdout | trim }}

- name: IMAGE MODE AMI | Validate Podman graph-root path
  ansible.builtin.assert:
    that:
      - image_mode_podman_graph_root_path | length > 0
      - image_mode_podman_graph_root_path.startswith('/')
      - image_mode_podman_graph_root_path != '/'
    fail_msg: >-
      Podman returned an invalid graph-root path:
      {{ image_mode_podman_graph_root_path | default('unknown') }}.

- name: IMAGE MODE AMI | Check Podman graph-root SELinux mapping
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - --list
  register: image_mode_selinux_fcontext_list
  changed_when: false
  become: true

- name: IMAGE MODE AMI | Add Podman graph-root SELinux mapping
  ansible.builtin.command:
    argv:
      - semanage
      - fcontext
      - --add
      - --type
      - container_var_lib_t
      - "{{ image_mode_podman_graph_root_path }}(/.*)?"
  when: >-
    image_mode_podman_graph_root_path
    not in image_mode_selinux_fcontext_list.stdout
  register: image_mode_podman_fcontext_add
  changed_when: image_mode_podman_fcontext_add.rc == 0
  become: true

- name: IMAGE MODE AMI | Restore Podman storage SELinux contexts
  ansible.builtin.command:
    argv:
      - restorecon
      - -R
      - -F
      - -v
      - "{{ image_mode_podman_graph_root_path }}"
  register: image_mode_podman_restorecon
  changed_when: >-
    image_mode_podman_restorecon.stdout | trim | length > 0
    or image_mode_podman_restorecon.stderr | trim | length > 0
  become: true

- name: IMAGE MODE AMI | Verify container execution
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - "{{ image_mode_base_image }}"
      - /bin/sh
      - -c
      - echo container-runtime-ok
  register: image_mode_container_runtime_test
  changed_when: false
  become: true

###############################################################################
# Select bootc base image
###############################################################################

- name: IMAGE MODE AMI | Select bootc base image
  ansible.builtin.set_fact:
    image_mode_base_image: >-
      {{
        image_mode_base_images[
          image_mode_rhel_major_version
        ]
      }}

- name: IMAGE MODE AMI | Display build configuration
  ansible.builtin.debug:
    msg:
      - "Builder Host: {{ inventory_hostname }}"
      - "Builder OS: RHEL {{ ansible_facts.distribution_version }}"
      - >-
        Satellite Release:
        {{
          image_mode_satellite_release
          if image_mode_satellite_release | length > 0
          else 'Not Locked'
        }}
      - "Effective Release: {{ image_mode_rhel_release }}"
      - "Bootc Base Image: {{ image_mode_base_image }}"

###############################################################################
# Pull bootc base image
###############################################################################

- name: IMAGE MODE AMI | Pull bootc base image
  ansible.builtin.command:
    argv:
      - podman
      - pull
      - "{{ image_mode_base_image }}"
  register: image_mode_base_image_pull
  changed_when: true
  when: image_mode_pull_base_image | bool

###############################################################################
# Build bootc container
###############################################################################

- name: IMAGE MODE AMI | Build bootc container
  ansible.builtin.command:
    argv:
      - podman
      - build
      - --pull=always
      - --build-arg
      - "IMAGE_MODE_BASE_IMAGE={{ image_mode_base_image }}"
      - --build-arg
      - "IMAGE_MODE_RHEL_RELEASE={{ image_mode_rhel_release }}"
      - --tag
      - "{{ image_mode_image_reference }}"
      - --file
      - "{{ image_mode_workspace }}/Containerfile"
      - "{{ image_mode_workspace }}"
  register: image_mode_container_build
  changed_when: true

###############################################################################
# Validate resulting image without starting a container
###############################################################################

- name: IMAGE MODE AMI | Inspect built image RHEL release label
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - "{{ image_mode_image_reference }}"
      - --format
      - >-
        {{ '{{' }} index .Labels
        "com.redhat.image-mode.rhel-release" {{ '}}' }}
  register: image_mode_built_image_release
  changed_when: false

- name: IMAGE MODE AMI | Validate built image RHEL release label
  ansible.builtin.assert:
    that:
      - image_mode_built_image_release.stdout | trim | length > 0
      - >-
        image_mode_built_image_release.stdout | trim
        == image_mode_rhel_release
    fail_msg: >-
      The built image reports RHEL release
      {{ image_mode_built_image_release.stdout | trim | default('unknown', true) }},
      but the selected Satellite release is
      {{ image_mode_rhel_release }}.

- name: IMAGE MODE AMI | Inspect built image RHEL major version
  ansible.builtin.set_fact:
    image_mode_built_image_major_version: >-
      {{
        image_mode_built_image_release.stdout
        | trim
        | split('.')
        | first
      }}

- name: IMAGE MODE AMI | Validate built image RHEL major version
  ansible.builtin.assert:
    that:
      - >-
        image_mode_built_image_major_version
        == image_mode_rhel_major_version
    fail_msg: >-
      The built image release label reports RHEL
      {{ image_mode_built_image_release.stdout | trim }},
      but the selected bootc base-image family is RHEL
      {{ image_mode_rhel_major_version }}.

- name: IMAGE MODE AMI | Inspect bootc label
  ansible.builtin.command:
    argv:
      - podman
      - image
      - inspect
      - "{{ image_mode_image_reference }}"
      - --format
      - >-
        {{ '{{' }} index .Labels "containers.bootc" {{ '}}' }}
  register: image_mode_bootc_label
  changed_when: false

- name: IMAGE MODE AMI | Validate bootc label
  ansible.builtin.assert:
    that:
      - image_mode_bootc_label.stdout | trim == "1"
    fail_msg: >-
      The built container {{ image_mode_image_reference }}
      does not expose containers.bootc=1.

###############################################################################
# Push image to Quay
###############################################################################

- name: IMAGE MODE AMI | Push bootc container to Quay
  ansible.builtin.command:
    argv:
      - podman
      - push
      - "{{ image_mode_image_reference }}"
  register: image_mode_container_push
  changed_when: true
  when: image_mode_push_container | bool
