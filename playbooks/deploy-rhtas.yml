---
- name: Deploy and configure Red Hat Trusted Artifact Signer
  hosts: rhtas
  become: true
  gather_facts: true

  vars:
    ###########################################################################
    # RHTAS host identity
    ###########################################################################

    rhtas_base_hostname: "{{ inventory_hostname }}"

    ###########################################################################
    # Keycloak / OIDC integration
    ###########################################################################

    rhtas_keycloak_realm: >-
      {{
        idm_realm_name
        | default(parent_domain_name)
        | lower
      }}

    rhtas_keycloak_url: >-
      https://{{ groups['keycloak'][0] }}

    rhtas_oidc_issuer: >-
      {{
        rhtas_oidc_issuer_url
        | default(
            rhtas_keycloak_url
            ~ '/realms/'
            ~ rhtas_keycloak_realm,
            true
          )
      }}

    rhtas_oidc_client: >-
      {{
        rhtas_oidc_client_id
        | default('trusted-artifact-signer')
      }}

    ###########################################################################
    # AWS Secrets Manager paths
    #
    # Reuse the existing Red Hat registry credentials that are already
    # provisioned for the Image Mode Lab.
    ###########################################################################

    rhtas_registry_username_secret_name: >-
      {{ secret_prefix }}/redhat/registry_username

    rhtas_registry_password_secret_name: >-
      {{ secret_prefix }}/redhat/registry_password

    ###########################################################################
    # RHTAS CA passphrase secret paths
    ###########################################################################

    rhtas_fulcio_ca_passphrase_secret_name: >-
      {{ secret_prefix }}/rhtas/fulcio_ca_passphrase

    rhtas_ctlog_ca_passphrase_secret_name: >-
      {{ secret_prefix }}/rhtas/ctlog_ca_passphrase

    rhtas_rekor_ca_passphrase_secret_name: >-
      {{ secret_prefix }}/rhtas/rekor_ca_passphrase

    rhtas_tsa_ca_passphrase_secret_name: >-
      {{ secret_prefix }}/rhtas/tsa_ca_passphrase

    ###########################################################################
    # Required RHTAS ingress names
    ###########################################################################

    rhtas_required_ingress_names:
      - "cli-server.{{ rhtas_base_hostname }}"
      - "fulcio.{{ rhtas_base_hostname }}"
      - "rekor.{{ rhtas_base_hostname }}"
      - "rekor-search.{{ rhtas_base_hostname }}"
      - "tsa.{{ rhtas_base_hostname }}"
      - "tuf.{{ rhtas_base_hostname }}"

    ###########################################################################
    # Red Hat artifact_signer role configuration
    #
    # Keep these at play scope. The collection merges its internal defaults
    # into play variables; passing these as include_role task variables would
    # override the merged values because task variables have higher precedence.
    ###########################################################################

    tas_single_node_base_hostname: "{{ rhtas_base_hostname }}"
    tas_single_node_registry_username: "{{ registry_username }}"
    tas_single_node_registry_password: "{{ registry_password }}"

    tas_single_node_fulcio:
      ca_passphrase: "{{ rhtas_fulcio_ca_passphrase }}"
      fulcio_config:
        oidc_issuers:
          - issuer: "{{ rhtas_oidc_issuer }}"
            client_id: "{{ rhtas_oidc_client }}"
            url: "{{ rhtas_oidc_issuer }}"
            type: email
        meta_issuers: []
        ci_issuer_metadata: []
      ct_log_prefix: "{{ rhtas_ct_log_prefix | default('rhtas-ctlog') }}"

    tas_single_node_ctlog:
      ca_passphrase: "{{ rhtas_ctlog_ca_passphrase }}"

    tas_single_node_rekor:
      ca_passphrase: "{{ rhtas_rekor_ca_passphrase }}"

    tas_single_node_tsa:
      ca_passphrase: "{{ rhtas_tsa_ca_passphrase }}"

  pre_tasks:
    ###########################################################################
    # PHASE 0
    # Validate deployment prerequisites
    ###########################################################################

    - name: PHASE 0 | Validate RHTAS host operating system
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'RedHat'
          - ansible_distribution_major_version | int == 9
          - ansible_distribution_version is version('9.4', '>=')
        fail_msg: >-
          The RHTAS single-node collection requires RHEL 9.4 or later.

    - name: PHASE 0 | Validate required inventory variables
      ansible.builtin.assert:
        that:
          - aws_region is defined
          - aws_region | string | length > 0
          - secret_prefix is defined
          - secret_prefix | string | length > 0
          - groups['keycloak'] | default([]) | length > 0
          - rhtas_base_hostname | string | length > 0
          - rhtas_oidc_issuer | string | length > 0
          - rhtas_oidc_client | string | length > 0
        fail_msg: >-
          RHTAS requires aws_region, secret_prefix, a Keycloak inventory
          group, an OIDC issuer, and an OIDC client identifier.

    ###########################################################################
    # PHASE 1
    # Retrieve protected credentials from AWS Secrets Manager
    ###########################################################################

    - name: PHASE 1 | Read protected RHTAS deployment credentials
      ansible.builtin.command:
        argv: >-
          {{
            [
              'aws',
              'secretsmanager',
              'get-secret-value',
              '--region',
              aws_region,
              '--secret-id',
              item.secret_name,
              '--query',
              'SecretString',
              '--output',
              'text'
            ]
            +
            (
              ['--profile', aws_profile]
              if aws_profile | default('') | trim | length > 0
              else []
            )
          }}
      delegate_to: localhost
      become: false
      register: rhtas_protected_secret_results
      changed_when: false
      no_log: true
      loop:
        - name: registry_username
          secret_name: "{{ rhtas_registry_username_secret_name }}"

        - name: registry_password
          secret_name: "{{ rhtas_registry_password_secret_name }}"

        - name: rhtas_fulcio_ca_passphrase
          secret_name: "{{ rhtas_fulcio_ca_passphrase_secret_name }}"

        - name: rhtas_ctlog_ca_passphrase
          secret_name: "{{ rhtas_ctlog_ca_passphrase_secret_name }}"

        - name: rhtas_rekor_ca_passphrase
          secret_name: "{{ rhtas_rekor_ca_passphrase_secret_name }}"

        - name: rhtas_tsa_ca_passphrase
          secret_name: "{{ rhtas_tsa_ca_passphrase_secret_name }}"

      loop_control:
        label: "{{ item.name }}"

    - name: PHASE 1 | Convert protected secrets into Ansible facts
      ansible.builtin.set_fact:
        "{{ item.item.name }}": "{{ item.stdout | trim }}"
      loop: "{{ rhtas_protected_secret_results.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    ###########################################################################
    # PHASE 2
    # Validate protected credentials
    ###########################################################################

    - name: PHASE 2 | Validate RHTAS registry credentials
      ansible.builtin.assert:
        that:
          - registry_username | default('') | trim | length > 0
          - registry_password | default('') | length > 0
        fail_msg: >-
          The Red Hat registry credentials could not be retrieved from
          AWS Secrets Manager. Verify
          {{ rhtas_registry_username_secret_name }} and
          {{ rhtas_registry_password_secret_name }} exist and are readable.

    - name: PHASE 2 | Validate RHTAS CA passphrases
      ansible.builtin.assert:
        that:
          - rhtas_fulcio_ca_passphrase | default('') | length >= 12
          - rhtas_ctlog_ca_passphrase | default('') | length >= 12
          - rhtas_rekor_ca_passphrase | default('') | length >= 12
          - rhtas_tsa_ca_passphrase | default('') | length >= 12
        fail_msg: >-
          One or more RHTAS CA passphrases are missing or shorter than
          12 characters. Verify the RHTAS passphrase secrets exist in
          AWS Secrets Manager.

    ###########################################################################
    # PHASE 3
    # Validate network and OIDC prerequisites
    ###########################################################################

    - name: PHASE 3 | Configure local RHTAS service-name resolution
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED RHTAS SERVICE NAMES"
        block: |
          {{ ansible_default_ipv4.address }} {{ rhtas_required_ingress_names | join(' ') }}
        owner: root
        group: root
        mode: "0644"

    - name: PHASE 3 | Verify all RHTAS ingress records resolve
      ansible.builtin.command:
        argv:
          - getent
          - ahostsv4
          - "{{ item }}"
      loop: "{{ rhtas_required_ingress_names }}"
      loop_control:
        label: "{{ item }}"
      register: rhtas_dns_lookup
      changed_when: false
      retries: 20
      delay: 15
      until: rhtas_dns_lookup.rc == 0

    - name: PHASE 3 | Verify the Keycloak OIDC discovery endpoint
      ansible.builtin.uri:
        url: "{{ rhtas_oidc_issuer }}/.well-known/openid-configuration"
        method: GET
        return_content: true
        status_code: 200
        validate_certs: true
      register: rhtas_oidc_discovery
      changed_when: false

    - name: PHASE 3 | Validate Keycloak OIDC issuer
      ansible.builtin.assert:
        that:
          - rhtas_oidc_discovery.json is defined
          - rhtas_oidc_discovery.json.issuer is defined
          - rhtas_oidc_discovery.json.issuer == rhtas_oidc_issuer
          - rhtas_oidc_discovery.json.authorization_endpoint is defined
          - rhtas_oidc_discovery.json.token_endpoint is defined
          - rhtas_oidc_discovery.json.jwks_uri is defined
        fail_msg: >-
          The Keycloak OIDC discovery document does not match the
          expected RHTAS issuer {{ rhtas_oidc_issuer }}.

  tasks:
    ###########################################################################
    # PHASE 4
    # Deploy Red Hat Trusted Artifact Signer
    ###########################################################################

    - name: PHASE 4 | Deploy the RHTAS single-node service
      ansible.builtin.include_role:
        name: redhat.artifact_signer.tas_single_node
      no_log: true

    ###########################################################################
    # PHASE 5
    # Configure signing clients
    ###########################################################################

    - name: PHASE 5 | Install signing-client environment configuration
      ansible.builtin.copy:
        dest: /etc/profile.d/rhtas.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          export RHTAS_BASE_HOSTNAME="{{ rhtas_base_hostname }}"
          export COSIGN_OIDC_CLIENT_ID="{{ rhtas_oidc_client }}"
          export COSIGN_OIDC_ISSUER="{{ rhtas_oidc_issuer }}"
          export COSIGN_CERTIFICATE_OIDC_ISSUER="{{ rhtas_oidc_issuer }}"
          export COSIGN_FULCIO_URL="https://fulcio.{{ rhtas_base_hostname }}"
          export COSIGN_REKOR_URL="https://rekor.{{ rhtas_base_hostname }}"
          export COSIGN_MIRROR="https://tuf.{{ rhtas_base_hostname }}"
          export COSIGN_ROOT="https://tuf.{{ rhtas_base_hostname }}/root.json"
          export COSIGN_YES="true"

  post_tasks:
    ###########################################################################
    # PHASE 6
    # Validate deployed RHTAS endpoints
    ###########################################################################

    - name: PHASE 6 | Verify RHTAS HTTPS endpoints
      ansible.builtin.uri:
        url: "https://{{ item }}"
        method: GET
        return_content: false
        status_code:
          - 200
          - 301
          - 302
          - 404
        validate_certs: false
      loop: "{{ rhtas_required_ingress_names }}"
      loop_control:
        label: "{{ item }}"
      register: rhtas_endpoint_checks
      retries: 20
      delay: 15
      until: rhtas_endpoint_checks is succeeded

    ###########################################################################
    # PHASE 7
    # Report deployment information
    ###########################################################################

    - name: PHASE 7 | Display RHTAS deployment information
      ansible.builtin.debug:
        msg:
          - "Red Hat Trusted Artifact Signer deployment completed."
          - "Base hostname: {{ rhtas_base_hostname }}"
          - "OIDC issuer: {{ rhtas_oidc_issuer }}"
          - "OIDC client: {{ rhtas_oidc_client }}"
          - "Fulcio: https://fulcio.{{ rhtas_base_hostname }}"
          - "Rekor: https://rekor.{{ rhtas_base_hostname }}"
          - "Timestamp Authority: https://tsa.{{ rhtas_base_hostname }}"
          - "TUF: https://tuf.{{ rhtas_base_hostname }}"

    ###########################################################################
    # PHASE 8
    # Clear sensitive Ansible facts
    ###########################################################################

    - name: PHASE 8 | Clear protected RHTAS credential facts
      ansible.builtin.set_fact:
        registry_username: ""
        registry_password: ""
        rhtas_fulcio_ca_passphrase: ""
        rhtas_ctlog_ca_passphrase: ""
        rhtas_rekor_ca_passphrase: ""
        rhtas_tsa_ca_passphrase: ""
      no_log: true
