---
###############################################################################
# PHASE 75
#
# Configure Image Builder hosts to resolve subordinate UID/GID ranges from IdM.
#
# The subordinate ranges must already exist in IdM. This phase only configures
# the Image Builder clients to retrieve those ranges through SSSD.
###############################################################################


###############################################################################
# Install required packages
###############################################################################

- name: PHASE 75 | Install subordinate-ID client packages
  ansible.builtin.dnf:
    name:
      - authselect
      - shadow-utils
      - shadow-utils-subid
      - sssd
      - sssd-client
      - sssd-common
      - sssd-ipa
      - sssd-tools
    state: present


# RHEL 10 no longer provides authselect-compat. The package is retained on
# RHEL 9 for compatibility with any legacy authconfig consumers on the host;
# this playbook itself invokes authselect directly.
- name: PHASE 75 | Install RHEL 9 authselect compatibility package
  ansible.builtin.dnf:
    name: authselect-compat
    state: present
  when:
    - ansible_facts.distribution == 'RedHat'
    - ansible_facts.distribution_major_version | int == 9


###############################################################################
# Validate IdM client configuration
###############################################################################

- name: PHASE 75 | Check IdM client configuration
  ansible.builtin.stat:
    path: /etc/ipa/default.conf
  register: image_builder_subid_ipa_configuration


- name: PHASE 75 | Check SSSD configuration
  ansible.builtin.stat:
    path: /etc/sssd/sssd.conf
  register: image_builder_subid_sssd_configuration


- name: PHASE 75 | Validate IdM and SSSD client configuration
  ansible.builtin.assert:
    that:
      - image_builder_subid_ipa_configuration.stat.exists
      - image_builder_subid_sssd_configuration.stat.exists
    fail_msg: >-
      {{ inventory_hostname }} is not configured as an IdM client.

      The following files must exist before subordinate-ID reconciliation:

        /etc/ipa/default.conf
        /etc/sssd/sssd.conf

      Run the IdM client enrollment phase before this phase.


###############################################################################
# Resolve current authselect profile
###############################################################################

- name: PHASE 75 | Query current authselect profile
  ansible.builtin.command:
    argv:
      - authselect
      - current
      - -r
  register: image_builder_subid_authselect_current
  changed_when: false
  failed_when: false


- name: PHASE 75 | Resolve authselect profile components
  ansible.builtin.set_fact:
    image_builder_subid_authselect_components: >-
      {{
        (
          image_builder_subid_authselect_current.stdout
          | default('')
          | trim
          | split
        )
        if
        (
          image_builder_subid_authselect_current.rc == 0
          and
          image_builder_subid_authselect_current.stdout
          | default('')
          | trim
          | length > 0
        )
        else
        [
          'sssd',
          'with-mkhomedir',
          'with-sudo'
        ]
      }}


- name: PHASE 75 | Validate resolved authselect profile
  ansible.builtin.assert:
    that:
      - image_builder_subid_authselect_components | length > 0
      - image_builder_subid_authselect_components[0] | length > 0
    fail_msg: >-
      Unable to determine the authselect profile for
      {{ inventory_hostname }}.


###############################################################################
# Repair authselect ownership when necessary
#
# This handles systems where /etc/nsswitch.conf was previously modified
# directly and is no longer managed as an authselect symbolic link.
###############################################################################

- name: PHASE 75 | Validate current authselect configuration
  ansible.builtin.command:
    argv:
      - authselect
      - check
  register: image_builder_subid_authselect_check
  changed_when: false
  failed_when: false


- name: PHASE 75 | Restore authselect-managed configuration
  ansible.builtin.command:
    argv: >-
      {{
        ['authselect', 'select']
        +
        image_builder_subid_authselect_components
        +
        ['--force']
      }}
  register: image_builder_subid_authselect_restore
  changed_when: true
  when:
    - image_builder_subid_authselect_check.rc != 0


###############################################################################
# Configure the subordinate-ID NSS database
###############################################################################

- name: PHASE 75 | Ensure authselect user NSS configuration exists
  ansible.builtin.file:
    path: /etc/authselect/user-nsswitch.conf
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve


- name: PHASE 75 | Configure SSSD as the subordinate-ID NSS provider
  ansible.builtin.lineinfile:
    path: /etc/authselect/user-nsswitch.conf
    regexp: '^[[:space:]]*subid[[:space:]]*:'
    line: 'subid: sss'
    state: present
    owner: root
    group: root
    mode: "0644"
  register: image_builder_subid_nss_configuration


- name: PHASE 75 | Apply authselect NSS changes
  ansible.builtin.command:
    argv:
      - authselect
      - apply-changes
  register: image_builder_subid_authselect_apply
  changed_when: >-
    image_builder_subid_nss_configuration.changed
    or
    image_builder_subid_authselect_restore.changed
  when:
    - >-
      image_builder_subid_nss_configuration.changed
      or
      image_builder_subid_authselect_restore.changed


###############################################################################
# Validate generated NSS configuration
###############################################################################

- name: PHASE 75 | Check generated nsswitch configuration
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - '^[[:space:]]*subid[[:space:]]*:[[:space:]]*sss([[:space:]]|$)'
      - /etc/nsswitch.conf
  register: image_builder_subid_nss_validation
  changed_when: false
  failed_when: false


- name: PHASE 75 | Validate subordinate-ID NSS provider
  ansible.builtin.assert:
    that:
      - image_builder_subid_nss_validation.rc == 0
    fail_msg: >-
      The subordinate-ID NSS provider was not written to
      /etc/nsswitch.conf on {{ inventory_hostname }}.

      Expected:

        subid: sss

      Verify the selected authselect profile permits additions from
      /etc/authselect/user-nsswitch.conf.


- name: PHASE 75 | Validate authselect configuration after changes
  ansible.builtin.command:
    argv:
      - authselect
      - check
  register: image_builder_subid_authselect_final_check
  changed_when: false
  failed_when:
    - image_builder_subid_authselect_final_check.rc != 0


###############################################################################
# Restart SSSD and clear cached identity data
###############################################################################

- name: PHASE 75 | Enable and restart SSSD
  ansible.builtin.systemd:
    name: sssd
    enabled: true
    state: restarted


- name: PHASE 75 | Clear SSSD identity cache
  ansible.builtin.command:
    argv:
      - sss_cache
      - -E
  changed_when: true


- name: PHASE 75 | Wait for SSSD to become active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - sssd
  register: image_builder_subid_sssd_status
  changed_when: false
  retries: 10
  delay: 3
  until:
    - image_builder_subid_sssd_status.rc == 0
    - image_builder_subid_sssd_status.stdout | trim == 'active'


###############################################################################
# Validate IdM connectivity
###############################################################################

- name: PHASE 75 | Query configured SSSD domains
  ansible.builtin.command:
    argv:
      - sssctl
      - domain-list
  register: image_builder_subid_sssd_domains
  changed_when: false
  failed_when:
    - image_builder_subid_sssd_domains.rc != 0


- name: PHASE 75 | Build optional validation-user list
  ansible.builtin.set_fact:
    image_builder_subid_users_to_validate: >-
      {{
        image_builder_subid_validation_users
        | default([], true)
        | unique
        | list
      }}


###############################################################################
# Validate known IdM users when supplied
#
# Example:
#
# image_builder_subid_validation_users:
#   - pduncan
#   - another_user
###############################################################################

- name: PHASE 75 | Validate IdM users resolve through SSSD
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ item }}"
  register: image_builder_subid_user_resolution
  changed_when: false
  failed_when:
    - image_builder_subid_user_resolution.rc != 0
  loop: "{{ image_builder_subid_users_to_validate }}"
  loop_control:
    label: "{{ item }}"


- name: PHASE 75 | Query subordinate IDs for validation users
  ansible.builtin.command:
    argv:
      - getsubids
      - "{{ item }}"
  register: image_builder_subid_user_ranges
  changed_when: false
  failed_when: false
  loop: "{{ image_builder_subid_users_to_validate }}"
  loop_control:
    label: "{{ item }}"


- name: PHASE 75 | Validate subordinate IDs for validation users
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | default('') | trim | length > 0
      - >-
        item.stdout
        is search('^[0-9]+:[ ]+[^ ]+[ ]+[0-9]+[ ]+[1-9][0-9]*')
    fail_msg: >-
      IdM user {{ item.item }} does not have a subordinate UID/GID range
      available through SSSD on {{ inventory_hostname }}.

      Ensure the upstream IdM subordinate-ID generation playbook completed,
      then verify the user directly with:

        getsubids {{ item.item }}

      Command output:

      {{ item.stdout | default('') }}

      Command error:

      {{ item.stderr | default('') }}
  loop: "{{ image_builder_subid_user_ranges.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"


###############################################################################
# Migrate existing rootless Podman storage
#
# Podman must update its user-namespace mappings after new subordinate ranges
# become available. This cannot be performed as root for remote IdM users
# unless the users are explicitly supplied and become_user can resolve them.
###############################################################################

- name: PHASE 75 | Migrate Podman storage for validation users
  ansible.builtin.command:
    argv:
      - podman
      - system
      - migrate
  become: true
  become_user: "{{ item }}"
  register: image_builder_subid_podman_migration
  changed_when: false
  failed_when: false
  loop: "{{ image_builder_subid_users_to_validate }}"
  loop_control:
    label: "{{ item }}"
  when:
    - image_builder_subid_migrate_podman | default(true) | bool


###############################################################################
# Results
###############################################################################

- name: PHASE 75 | Display subordinate-ID client configuration
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "NSS subordinate-ID provider: sss"
      - >-
        Authselect profile:
        {{ image_builder_subid_authselect_components | join(' ') }}
      - >-
        SSSD domains:
        {{
          image_builder_subid_sssd_domains.stdout_lines
          | default([])
          | join(', ')
        }}
      - >-
        Validated users:
        {{
          image_builder_subid_users_to_validate
          | join(', ')
          | default('None supplied', true)
        }}
      - "Status: subordinate-ID client configuration completed"
