---
###############################################################################
# Create Additional Image Mode Lab Users
#
# Workflow:
#
# 1. Authenticate with the IdM administrator credential.
# 2. Confirm the ipausers group exists.
# 3. Use LDAP to discover all numeric user* accounts in ipausers.
# 4. Find the highest existing numeric suffix.
# 5. Allocate the requested number of usernames after that suffix.
# 6. Verify those usernames do not already exist.
# 7. Create users using idm_normal_password as their initial password.
# 8. Generate subordinate UID/GID ranges only when missing.
#
# Required AAP credentials:
#
#   Image Mode Machine Credential
#   Image Mode IdM Administrator Credential
#   Image Mode IdM Non-Admin Credential
#
# Required survey variable:
#
#   number_of_users_var
###############################################################################

- name: Create Additional Image Mode Lab Users
  hosts: idm-1*
  become: true
  gather_facts: false
  any_errors_fatal: true

  vars:

    ###########################################################################
    # Administrator credential
    ###########################################################################

    idm_credential_username: >-
      {{
        idm_admin_username
        | default(
            ipaadmin_principal
            | default('', true),
            true
          )
      }}

    idm_credential_secret: >-
      {{
        idm_admin_password
        | default(
            ipaadmin_password
            | default('', true),
            true
          )
      }}

    ###########################################################################
    # Normal-user credential
    #
    # idm_normal_password is used as the initial password for every newly
    # created numbered user.
    ###########################################################################

    idm_normal_credential_username: >-
      {{
        idm_normal_username
        | default('', true)
      }}

    idm_new_user_initial_password: >-
      {{
        idm_normal_password
        | default('', true)
      }}

    ###########################################################################
    # User allocation
    ###########################################################################

    idm_user_prefix: "user"
    idm_user_number_width: 2
    idm_generate_user_subids: true


  pre_tasks:

    ###########################################################################
    # PHASE 01
    # Validate inputs
    ###########################################################################

    - name: PHASE 01 | Validate requested number of users
      ansible.builtin.assert:
        that:
          - number_of_users_var is defined
          - number_of_users_var | int >= 1
        fail_msg: >-
          number_of_users_var must be defined and greater than or equal to 1.
        success_msg: >-
          Requested creation of {{ number_of_users_var | int }}
          additional Image Mode Lab users.


    - name: PHASE 01 | Resolve credential availability
      ansible.builtin.set_fact:
        idm_admin_username_available: >-
          {{
            idm_credential_username
            | string
            | trim
            | length > 0
          }}
        idm_admin_password_available: >-
          {{
            idm_credential_secret
            | string
            | length > 0
          }}
        idm_normal_username_available: >-
          {{
            idm_normal_credential_username
            | string
            | trim
            | length > 0
          }}
        idm_normal_password_available: >-
          {{
            idm_new_user_initial_password
            | string
            | length > 0
          }}
      no_log: true


    - name: PHASE 01 | Validate administrator credential
      ansible.builtin.assert:
        that:
          - idm_admin_username_available | bool
          - idm_admin_password_available | bool
        fail_msg: >-
          Image Mode IdM Administrator Credential was not injected.

          Required variables:

            idm_admin_username
            idm_admin_password


    - name: PHASE 01 | Validate normal-user credential
      ansible.builtin.assert:
        that:
          - idm_normal_username_available | bool
          - idm_normal_password_available | bool
        fail_msg: >-
          Image Mode IdM Non-Admin Credential was not injected.

          Required variables:

            idm_normal_username
            idm_normal_password


    - name: PHASE 01 | Install LDAP client utilities
      ansible.builtin.dnf:
        name:
          - openldap-clients
          - krb5-workstation
        state: present


  tasks:

    ###########################################################################
    # PHASE 02
    # Authenticate to IdM
    ###########################################################################

    - name: PHASE 02 | Obtain administrator Kerberos authentication
      ansible.builtin.command:
        argv:
          - kinit
          - "{{ idm_credential_username }}"
        stdin: "{{ idm_credential_secret }}"
        stdin_add_newline: true
      register: idm_admin_kinit
      changed_when: false
      failed_when: false
      no_log: true


    - name: PHASE 02 | Validate administrator authentication
      ansible.builtin.assert:
        that:
          - idm_admin_kinit.rc | default(1) == 0
        fail_msg: >-
          Kerberos authentication failed for the injected IdM administrator.

          Verify the administrator credential, DNS resolution, time
          synchronization, and /etc/krb5.conf.


    - name: PHASE 02 | Verify active Kerberos ticket
      ansible.builtin.command:
        argv:
          - klist
          - -s
      register: idm_admin_klist
      changed_when: false
      failed_when: false


    - name: PHASE 02 | Validate active Kerberos ticket
      ansible.builtin.assert:
        that:
          - idm_admin_klist.rc == 0
        fail_msg: >-
          IdM administrator authentication completed, but no active Kerberos
          ticket was found.


    ###########################################################################
    # PHASE 03
    # Resolve the IdM LDAP environment
    ###########################################################################

    - name: PHASE 03 | Resolve IdM server hostname
      ansible.builtin.command:
        argv:
          - hostname
          - -f
      register: idm_server_hostname_result
      changed_when: false
      failed_when:
        - idm_server_hostname_result.rc != 0
        - idm_server_hostname_result.stdout | trim | length == 0


    - name: PHASE 03 | Query IdM LDAP base DN
      ansible.builtin.command:
        argv:
          - ipa
          - env
          - basedn
      register: idm_environment_result
      changed_when: false
      failed_when: false


    - name: PHASE 03 | Validate LDAP base-DN query
      ansible.builtin.assert:
        that:
          - idm_environment_result.rc == 0
          - >-
            (
              idm_environment_result.stdout_lines
              | map('trim')
              | select('match', '^basedn:[ ]*.+$')
              | list
              | length
            )
            == 1
        fail_msg: >-
          Unable to determine the IdM LDAP base DN.

          Output:

          {{ idm_environment_result.stdout | default('') }}

          Error:

          {{ idm_environment_result.stderr | default('') }}


    - name: PHASE 03 | Store IdM LDAP information
      ansible.builtin.set_fact:
        idm_server_hostname: >-
          {{
            idm_server_hostname_result.stdout
            | trim
          }}

        idm_ldap_base_dn: >-
          {{
            (
              idm_environment_result.stdout_lines
              | map('trim')
              | select('match', '^basedn:[ ]*.+$')
              | first
            )
            | regex_replace('^basedn:[ ]*', '')
            | trim
          }}


    - name: PHASE 03 | Build ipausers distinguished name
      ansible.builtin.set_fact:
        idm_ipausers_group_dn: >-
          cn=ipausers,cn=groups,cn=accounts,{{ idm_ldap_base_dn }}

        idm_users_search_base: >-
          cn=users,cn=accounts,{{ idm_ldap_base_dn }}


    - name: PHASE 03 | Validate resolved LDAP information
      ansible.builtin.assert:
        that:
          - idm_server_hostname | length > 0
          - idm_ldap_base_dn | length > 0
          - idm_ipausers_group_dn | length > 0
          - idm_users_search_base | length > 0
        fail_msg: >-
          The IdM LDAP server, base DN, ipausers group DN, or users search
          base could not be resolved.


    ###########################################################################
    # PHASE 04
    # Confirm ipausers exists
    ###########################################################################

    - name: PHASE 04 | Query ipausers group
      ansible.builtin.command:
        argv:
          - ipa
          - group-show
          - ipausers
          - --all
          - --raw
      register: idm_ipausers_group
      changed_when: false
      failed_when: false


    - name: PHASE 04 | Validate ipausers group
      ansible.builtin.assert:
        that:
          - idm_ipausers_group.rc == 0
        fail_msg: >-
          Unable to query the IdM ipausers group.

          Error:

          {{ idm_ipausers_group.stderr | default('') }}


    ###########################################################################
    # PHASE 05
    # Discover numeric user* accounts in ipausers through LDAP
    #
    # LDAP first returns accounts matching user*. Ansible then applies the
    # stricter user[0-9]+ expression so accounts such as user-service are
    # ignored.
    ###########################################################################

    - name: PHASE 05 | Query numbered ipausers accounts through LDAP
      ansible.builtin.command:
        argv:
          - ldapsearch
          - -LLL
          - -o
          - ldif-wrap=no
          - -Y
          - GSSAPI
          - -H
          - "ldap://{{ idm_server_hostname }}"
          - -b
          - "{{ idm_users_search_base }}"
          - >-
            (&(objectClass=posixAccount)
            (memberOf={{ idm_ipausers_group_dn }})
            (uid={{ idm_user_prefix }}*))
          - uid
      register: idm_numbered_user_ldap_query
      changed_when: false
      failed_when: false


    - name: PHASE 05 | Validate LDAP user query
      ansible.builtin.assert:
        that:
          - idm_numbered_user_ldap_query.rc == 0
        fail_msg: >-
          LDAP could not query numeric user accounts associated with ipausers.

          LDAP server:

          {{ idm_server_hostname }}

          Search base:

          {{ idm_users_search_base }}

          Error:

          {{ idm_numbered_user_ldap_query.stderr | default('') }}


    - name: PHASE 05 | Extract numeric Image Mode Lab users
      ansible.builtin.set_fact:
        idm_existing_numbered_users: >-
          {{
            idm_numbered_user_ldap_query.stdout_lines
            | map('trim')
            | select(
                'match',
                '^uid: '
                ~ idm_user_prefix
                ~ '[0-9]+$'
              )
            | map(
                'regex_replace',
                '^uid: ',
                ''
              )
            | unique
            | sort
            | list
          }}


    - name: PHASE 05 | Display discovered numbered users
      ansible.builtin.debug:
        msg:
          - >-
            Numbered users discovered in ipausers:
            {{ idm_existing_numbered_users | length }}
          - >-
            Existing numbered users:
            {{
              idm_existing_numbered_users
              | join(', ')
              | default('None', true)
            }}


    ###########################################################################
    # PHASE 06
    # Extract numeric suffixes
    ###########################################################################

    - name: PHASE 06 | Initialize numeric suffix list
      ansible.builtin.set_fact:
        idm_existing_user_numbers: []


    - name: PHASE 06 | Extract existing numeric suffixes
      ansible.builtin.set_fact:
        idm_existing_user_numbers: >-
          {{
            idm_existing_user_numbers
            +
            [
              (
                item
                | regex_replace(
                    '^' ~ idm_user_prefix,
                    ''
                  )
                | int
              )
            ]
          }}
      loop: "{{ idm_existing_numbered_users }}"
      loop_control:
        label: "{{ item }}"


    ###########################################################################
    # PHASE 07
    # Find the highest allocated user number
    ###########################################################################

    - name: PHASE 07 | Determine highest existing user number
      ansible.builtin.set_fact:
        idm_highest_user_number: >-
          {{
            (
              idm_existing_user_numbers
              | max
            )
            if
            (
              idm_existing_user_numbers
              | length > 0
            )
            else 0
          }}


    - name: PHASE 07 | Determine next available user number
      ansible.builtin.set_fact:
        idm_next_user_number: >-
          {{
            (idm_highest_user_number | int) + 1
          }}


    ###########################################################################
    # PHASE 08
    # Allocate the requested user range
    ###########################################################################

    - name: PHASE 08 | Build requested user-number range
      ansible.builtin.set_fact:
        idm_new_user_numbers: >-
          {{
            range(
              idm_next_user_number | int,
              (
                (idm_next_user_number | int)
                +
                (number_of_users_var | int)
              )
            )
            | list
          }}


    - name: PHASE 08 | Validate allocated user-number count
      ansible.builtin.assert:
        that:
          - >-
            idm_new_user_numbers | length
            ==
            number_of_users_var | int
        fail_msg: >-
          The allocated user-number count does not match
          number_of_users_var.


    ###########################################################################
    # PHASE 09
    # Build user definitions
    ###########################################################################

    - name: PHASE 09 | Initialize new user definitions
      ansible.builtin.set_fact:
        idm_new_users: []


    - name: PHASE 09 | Build new Image Mode Lab user definitions
      ansible.builtin.set_fact:
        idm_new_users: >-
          {{
            idm_new_users
            +
            [
              {
                'name':
                  idm_user_prefix
                  ~
                  idm_formatted_user_number,
                'first': 'User',
                'last': idm_formatted_user_number,
                'password': idm_new_user_initial_password
              }
            ]
          }}
      vars:
        idm_formatted_user_number: >-
          {{
            '%0*d'
            | format(
                idm_user_number_width | int,
                item | int
              )
          }}
      loop: "{{ idm_new_user_numbers }}"
      loop_control:
        label: >-
          {{
            idm_user_prefix
            ~
            (
              '%0*d'
              | format(
                  idm_user_number_width | int,
                  item | int
                )
            )
          }}
      no_log: true


    - name: PHASE 09 | Build safe username list
      ansible.builtin.set_fact:
        idm_new_usernames: >-
          {{
            idm_new_users
            | map(attribute='name')
            | list
          }}


    - name: PHASE 09 | Validate generated usernames
      ansible.builtin.assert:
        that:
          - idm_new_users | length == number_of_users_var | int
          - >-
            idm_new_usernames | unique | length
            ==
            idm_new_usernames | length
          - >-
            (
              idm_new_usernames
              | intersect(idm_existing_numbered_users)
              | length
            )
            == 0
        fail_msg: >-
          Generated usernames are invalid or already exist.


    ###########################################################################
    # PHASE 10
    # Verify names are still available
    #
    # This protects against an account being created after the LDAP discovery
    # but before this job reaches the creation phase.
    ###########################################################################

    - name: PHASE 10 | Check generated usernames for conflicts
      ansible.builtin.command:
        argv:
          - ipa
          - user-show
          - "{{ item }}"
          - --raw
      register: idm_new_username_conflict_queries
      changed_when: false
      failed_when: false
      loop: "{{ idm_new_usernames }}"
      loop_control:
        label: "{{ item }}"


    - name: PHASE 10 | Validate generated usernames are available
      ansible.builtin.assert:
        that:
          - item.rc != 0
          - >-
            'not found'
            in
            (
              (
                item.stdout
                | default('')
              )
              ~
              (
                item.stderr
                | default('')
              )
              | lower
            )
        fail_msg: >-
          Generated username {{ item.item }} already exists or its
          availability could not be verified.

          The job will not modify an existing IdM account.

          Output:

          {{ item.stdout | default('') }}

          Error:

          {{ item.stderr | default('') }}
      loop: "{{ idm_new_username_conflict_queries.results }}"
      loop_control:
        label: "{{ item.item }}"


    - name: PHASE 10 | Display user-creation plan
      ansible.builtin.debug:
        msg:
          - >-
            Highest existing numbered user:
            {{
              (
                idm_user_prefix
                ~
                (
                  '%0*d'
                  | format(
                      idm_user_number_width | int,
                      idm_highest_user_number | int
                    )
                )
              )
              if idm_highest_user_number | int > 0
              else 'None'
            }}
          - >-
            Requested new users:
            {{ number_of_users_var | int }}
          - >-
            Usernames to create:
            {{ idm_new_usernames }}


    ###########################################################################
    # PHASE 11
    # Create users
    ###########################################################################

    - name: PHASE 11 | Create additional Image Mode Lab users
      block:

        - name: PHASE 11 | Run IdM user creation
          freeipa.ansible_freeipa.ipauser:
            ipaadmin_principal: "{{ idm_credential_username }}"
            ipaadmin_password: "{{ idm_credential_secret }}"
            users: "{{ idm_new_users }}"
            update_password: on_create
            state: present
          register: idm_additional_user_creation
          no_log: true

      rescue:

        - name: PHASE 11 | Report IdM user-creation failure
          ansible.builtin.fail:
            msg: >-
              IdM user creation failed.

              Verify:

                - both IdM credentials are attached
                - freeipa.ansible_freeipa is installed
                - idm_normal_password satisfies the IdM password policy
                - the generated usernames are still available
                - the administrator has user-creation permission


    ###########################################################################
    # PHASE 12
    # Verify created users
    #
    # ipa output is indented, for example:
    #
    #   "  uid: user02"
    #
    # stdout_lines are trimmed before matching.
    ###########################################################################

    - name: PHASE 12 | Query newly created users
      ansible.builtin.command:
        argv:
          - ipa
          - user-show
          - "{{ item }}"
          - --all
          - --raw
      register: idm_created_user_queries
      changed_when: false
      failed_when: false
      loop: "{{ idm_new_usernames }}"
      loop_control:
        label: "{{ item }}"


    - name: PHASE 12 | Validate newly created users
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - >-
            (
              item.stdout_lines
              | default([])
              | map('trim')
              | select(
                  'equalto',
                  'uid: ' ~ item.item
                )
              | list
              | length
            )
            == 1
          - >-
            (
              item.stdout_lines
              | default([])
              | map('trim')
              | select(
                  'equalto',
                  'memberof: ' ~ idm_ipausers_group_dn
                )
              | list
              | length
            )
            >= 1
        fail_msg: >-
          IdM user {{ item.item }} was not validated after creation.

          The command returned rc={{ item.rc }}, but the expected uid or
          ipausers membership was not present.

          Output:

          {{ item.stdout | default('') }}

          Error:

          {{ item.stderr | default('') }}
      loop: "{{ idm_created_user_queries.results }}"
      loop_control:
        label: "{{ item.item }}"



    ###############################################################################
    # PHASE 13
    # Query current subordinate UID/GID ranges
    ###############################################################################

    - name: PHASE 13 | Query subordinate IDs for new users
      ansible.builtin.command:
        argv:
          - ipa
          - subid-find
          - "--owner={{ item }}"
      register: idm_new_user_subid_queries
      changed_when: false

      # FreeIPA returns:
      #
      # rc=0 when one or more subordinate-ID records are found.
      # rc=1 when the query succeeds but zero records are found.
      #
      # Other return codes are operational failures.

      failed_when:
        - idm_new_user_subid_queries.rc not in [0, 1]

      loop: "{{ idm_new_usernames }}"
      loop_control:
        label: "{{ item }}"

      when:
        - idm_generate_user_subids | bool

    - name: PHASE 13 | Validate subordinate-ID query results
      ansible.builtin.assert:
        that:
          - item.rc in [0, 1]

          # rc=0 represents an existing subordinate-ID assignment.
          # rc=1 is accepted only when FreeIPA explicitly reports zero matches.
          - >-
            (
              item.rc == 0
            )
            or
            (
              item.rc == 1
              and
              (
                (
                  '0 subordinate ids matched'
                  in (item.stdout | default(''))
                )
                or
                (
                  'Number of entries returned 0'
                  in (item.stdout | default(''))
                )
              )
            )

        fail_msg: >-
          Unable to determine the subordinate-ID state for {{ item.item }}.

          Return code:

          {{ item.rc }}

          Output:

          {{ item.stdout | default('') }}

          Error:

          {{ item.stderr | default('') }}

      loop: "{{ idm_new_user_subid_queries.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

      when:
        - not (item.skipped | default(false))

    ###############################################################################
    # PHASE 14
    # Separate existing and missing subordinate-ID assignments
    ###############################################################################

    - name: PHASE 14 | Initialize subordinate-ID result lists
      ansible.builtin.set_fact:
        idm_users_with_existing_subids: []
        idm_users_missing_subids: []

    - name: PHASE 14 | Record users with existing subordinate IDs
      ansible.builtin.set_fact:
        idm_users_with_existing_subids: >-
          {{
            idm_users_with_existing_subids
            +
            [
              item.item
            ]
          }}

      loop: "{{ idm_new_user_subid_queries.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

      when:
        - not (item.skipped | default(false))
        - item.rc == 0
        - >-
          '0 subordinate ids matched'
          not in (item.stdout | default(''))
        - >-
          'Number of entries returned 0'
          not in (item.stdout | default(''))

    - name: PHASE 14 | Record users missing subordinate IDs
      ansible.builtin.set_fact:
        idm_users_missing_subids: >-
          {{
            idm_users_missing_subids
            +
            [
              item.item
            ]
          }}

      loop: "{{ idm_new_user_subid_queries.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

      when:
        - not (item.skipped | default(false))
        - >-
          (
            item.rc == 1
          )
          or
          (
            '0 subordinate ids matched'
            in (item.stdout | default(''))
          )
          or
          (
            'Number of entries returned 0'
            in (item.stdout | default(''))
          )

    - name: PHASE 14 | Display subordinate-ID allocation plan
      ansible.builtin.debug:
        msg:
          - >-
            Users with existing subordinate IDs:
            {{
              idm_users_with_existing_subids
              | join(', ')
              | default('None', true)
            }}
          - >-
            Users requiring subordinate IDs:
            {{
              idm_users_missing_subids
              | join(', ')
              | default('None', true)
            }}

    ###############################################################################
    # PHASE 15
    # Generate only missing subordinate UID/GID ranges
    ###############################################################################

    - name: PHASE 15 | Generate missing subordinate IDs
      ansible.builtin.command:
        argv:
          - ipa
          - subid-generate
          - "--owner={{ item }}"
      register: idm_new_user_subid_generation
      changed_when:
        - idm_new_user_subid_generation.rc == 0

      # If another process creates the range between the query and this task,
      # treat "already exists" as a successful reconciliation.

      failed_when:
        - idm_new_user_subid_generation.rc != 0
        - >-
          'already exists'
          not in
          (
            idm_new_user_subid_generation.stdout
            | default('')
            | lower
          )
        - >-
          'already exists'
          not in
          (
            idm_new_user_subid_generation.stderr
            | default('')
            | lower
          )

      loop: "{{ idm_users_missing_subids }}"
      loop_control:
        label: "{{ item }}"

    ###############################################################################
    # PHASE 16
    # Validate final subordinate UID/GID ranges
    ###############################################################################

    - name: PHASE 16 | Query final subordinate-ID assignments
      ansible.builtin.command:
        argv:
          - ipa
          - subid-find
          - "--owner={{ item }}"
      register: idm_new_user_subid_validation
      changed_when: false
      failed_when: false

      loop: "{{ idm_new_usernames }}"
      loop_control:
        label: "{{ item }}"

      when:
        - idm_generate_user_subids | bool

    - name: PHASE 16 | Validate final subordinate-ID assignments
      ansible.builtin.assert:
        that:
          - item.rc == 0

          - >-
            '0 subordinate ids matched'
            not in (item.stdout | default(''))

          - >-
            'Number of entries returned 0'
            not in (item.stdout | default(''))

          - >-
            item.stdout
            is search('SubUID range start:[ ]+[0-9]+')

          - >-
            item.stdout
            is search('SubUID range size:[ ]+[1-9][0-9]*')

          - >-
            item.stdout
            is search('SubGID range start:[ ]+[0-9]+')

          - >-
            item.stdout
            is search('SubGID range size:[ ]+[1-9][0-9]*')

        fail_msg: >-
          IdM user {{ item.item }} does not have a valid subordinate UID/GID
          range after reconciliation.

          Return code:

          {{ item.rc }}

          Output:

          {{ item.stdout | default('') }}

          Error:

          {{ item.stderr | default('') }}

      loop: "{{ idm_new_user_subid_validation.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"

      when:
        - not (item.skipped | default(false))




    ###########################################################################
    # PHASE 16
    # Publish results
    ###########################################################################

    - name: PHASE 16 | Determine final user number
      ansible.builtin.set_fact:
        idm_final_user_number: >-
          {{
            (idm_next_user_number | int)
            +
            (number_of_users_var | int)
            -
            1
          }}


    - name: PHASE 16 | Publish user-creation workflow artifacts
      ansible.builtin.set_stats:
        data:
          idm_created_usernames: "{{ idm_new_usernames }}"
          idm_created_user_count: "{{ idm_new_usernames | length }}"
          idm_previous_highest_user_number: "{{ idm_highest_user_number }}"
          idm_current_highest_user_number: "{{ idm_final_user_number }}"
          idm_subids_reconciled: "{{ idm_generate_user_subids | bool }}"
        per_host: false


    - name: PHASE 16 | Display final results
      ansible.builtin.debug:
        msg:
          - >-
            Previous highest user number:
            {{ idm_highest_user_number }}
          - >-
            Created users:
            {{ idm_new_usernames }}
          - >-
            Current highest user:
            {{
              idm_user_prefix
              ~
              (
                '%0*d'
                | format(
                    idm_user_number_width | int,
                    idm_final_user_number | int
                  )
              )
            }}
          - >-
            Initial password source:
            Image Mode IdM Non-Admin Credential
          - >-
            Subordinate IDs reconciled:
            {{ idm_generate_user_subids | bool }}


  post_tasks:

    ###########################################################################
    # PHASE 17
    # Remove administrator Kerberos ticket
    ###########################################################################

    - name: PHASE 17 | Destroy administrator Kerberos authentication
      ansible.builtin.command:
        argv:
          - kdestroy
      changed_when: false
      failed_when: false
      no_log: true