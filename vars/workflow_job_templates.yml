---
###############################################################################
# Image Mode workflow job templates
###############################################################################

controller_workflows:

  - name: "Image Mode Deploy Sample Image to AWS"
    description: >-
      Build the sample RHEL Image Mode container image, create and register an
      AWS AMI, publish the AMI metadata as workflow artifacts, configure the
      Satellite AWS compute-resource image to use the newly created AMI, and
      then use Satellite to create and provision the resulting EC2 host.
    organization: "Image Mode Lab"
    destroy_current_nodes: true

    workflow_nodes:

      #########################################################################
      # Build Image Mode AMI
      #########################################################################

      - identifier: "build_image_mode_ami"

        unified_job_template:
          name: "Build Image Mode AMI"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "configure_satellite_for_new_ami"

      #########################################################################
      # Configure Satellite for New AMI
      #########################################################################

      - identifier: "configure_satellite_for_new_ami"

        unified_job_template:
          name: "Configure Satellite for New AMI"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "use_satellite_to_deploy_ec2_instances"

      #########################################################################
      # Use Satellite to Deploy EC2 Instance
      #########################################################################

      - identifier: "use_satellite_to_deploy_ec2_instances"

        unified_job_template:
          name: "Use Satellite To Deploy EC2 Instances"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

      #########################################################################
      # Generate AWS certificates
      #########################################################################

      - identifier: "generate_image_builder_aws_certificates"

        unified_job_template:
          name: "Generate Image Builder AWS Certificates"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "stage_image_builder_certificates"

      #########################################################################
      # Copy certificates to staged hosts
      #########################################################################

      - identifier: "stage_image_builder_certificates"

        unified_job_template:
          name: "Stage Image Builder Certificates"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "register_image_builders_with_satellite"

      #########################################################################
      # Register staged hosts with Satellite
      #########################################################################

      - identifier: "register_image_builders_with_satellite"

        unified_job_template:
          name: "Register Image Builder Hosts with Satellite"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "validate_staged_image_builders"

      #########################################################################
      # Validate staged hosts
      #########################################################################

      - identifier: "validate_staged_image_builders"

        unified_job_template:
          name: "Validate Staged Image Builder Hosts"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "promote_staged_image_builders"

      #########################################################################
      # Promote hosts to production inventory
      #########################################################################

      - identifier: "promote_staged_image_builders"

        unified_job_template:
          name: "Promote Staged Image Builder Hosts"
          organization:
            name: "Image Mode Lab"
          type: "job_template"