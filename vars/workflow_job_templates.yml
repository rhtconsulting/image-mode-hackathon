---
###############################################################################
# Image Mode sample-image deployment workflow
#
# Workflow order:
#
#   1. Build Image Mode AMI
#   2. Configure Satellite for New AMI
#
# The Satellite job runs only when the AMI build completes successfully.
###############################################################################

controller_workflows:

  - name: "Image Mode Deploy Sample Image to AWS"
    description: >-
      Build the sample RHEL Image Mode container image, create and register an
      AWS AMI, publish the AMI metadata as workflow artifacts, and configure
      the Satellite AWS compute-resource image to use the newly created AMI.
    organization: "Image Mode Lab"

    destroy_current_nodes: true

    workflow_nodes:

      #########################################################################
      # Build and register the AWS AMI
      #########################################################################

      - identifier: "build_image_mode_ami"
        unified_job_template: "Build Image Mode AMI"

        related:
          success_nodes:
            - identifier: "configure_satellite_for_new_ami"

      #########################################################################
      # Configure the Satellite compute-resource image
      #########################################################################

      - identifier: "configure_satellite_for_new_ami"
        unified_job_template: "Configure Satellite for New AMI"