---
###############################################################################
# PHASE 03
#
# Build the desired Image Builder host inventory.
# AMI IDs are attached later, after dynamic AMI discovery.
###############################################################################

- name: PHASE 03 | Initialize desired host inventory
  ansible.builtin.set_fact:
    image_builder_desired_hosts: []

- name: PHASE 03 | Generate desired host definitions
  ansible.builtin.set_fact:
    image_builder_desired_hosts: >-
      {{
        image_builder_desired_hosts
        +
        [
          {
            'name':
              generation.hostname_prefix
              ~ host_number
              ~ '.'
              ~ image_builder_domain_name,
            'short_name':
              generation.hostname_prefix
              ~ host_number,
            'generation':
              generation.name,
            'rhel_major_version':
              generation.rhel_major_version,
            'host_number':
              host_number | int
          }
        ]
      }}
  loop: >-
    {{
      image_builder_generations
      | product(
          range(
            1,
            (generated_number_of_host_var | int) + 1
          )
        )
      | list
    }}
  vars:
    generation: "{{ item.0 }}"
    host_number: "{{ item.1 }}"
  loop_control:
    label: >-
      {{
        generation.hostname_prefix
        ~ host_number
        ~ '.'
        ~ image_builder_domain_name
      }}

- name: PHASE 03 | Validate desired host inventory
  ansible.builtin.assert:
    that:
      - image_builder_desired_hosts | length > 0
      - item.name | length > 0
      - item.short_name | length > 0
      - item.generation | length > 0
      - item.rhel_major_version | string | length > 0
    fail_msg: >-
      An invalid desired Image Builder host definition was generated:
      {{ item }}
  loop: "{{ image_builder_desired_hosts }}"
  loop_control:
    label: "{{ item.name | default('UNKNOWN') }}"

- name: PHASE 03 | Display desired Image Builder hosts
  ansible.builtin.debug:
    var: image_builder_desired_hosts