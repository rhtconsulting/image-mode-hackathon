# Configure sample-rhel9-web protected branch access
###############################################################################

- name: PHASE 11 | Allow Developers to push and merge the main branch
  ansible.builtin.command:
    argv:
      - gitlab-rails
      - runner
      - "-"
  args:
    stdin: |
      require "json"

      project_path =
        ENV.fetch(
          "GITLAB_PROJECT_PATH"
        ).to_s.strip

      branch_name =
        ENV.fetch(
          "GITLAB_PROTECTED_BRANCH_NAME",
          "main"
        ).to_s.strip

      allow_developer_push =
        ENV.fetch(
          "GITLAB_ALLOW_DEVELOPER_PUSH",
          "true"
        ) == "true"

      allow_developer_merge =
        ENV.fetch(
          "GITLAB_ALLOW_DEVELOPER_MERGE",
          "true"
        ) == "true"

      allow_force_push =
        ENV.fetch(
          "GITLAB_ALLOW_FORCE_PUSH",
          "false"
        ) == "true"

      result = {
        project: project_path,
        branch: branch_name,
        protected_branch_created: false,
        push_access_created: false,
        push_access_updated: false,
        merge_access_created: false,
        merge_access_updated: false,
        conflicting_push_levels_removed: [],
        conflicting_merge_levels_removed: [],
        force_push_updated: false,
        existing: false,
        errors: []
      }

      begin
        raise "project path is empty" if project_path.empty?
        raise "branch name is empty" if branch_name.empty?

        project =
          Project.find_by_full_path(
            project_path
          )

        raise(
          "GitLab project #{project_path.inspect} does not exist"
        ) unless project

        developer_access =
          Gitlab::Access::DEVELOPER

        protected_branch =
          project.protected_branches.find_by(
            name: branch_name
          )

        if protected_branch.nil?
          protected_branch =
            project.protected_branches.create!(
              name: branch_name,
              allow_force_push: allow_force_push
            )

          result[:protected_branch_created] = true
        end

        #######################################################################
        # Configure direct push access
        #
        # Access level 30 permits Developers and all higher roles.
        #######################################################################

        if allow_developer_push
          push_access_levels =
            protected_branch.push_access_levels

          developer_push_level =
            push_access_levels.find_by(
              access_level: developer_access
            )

          if developer_push_level.nil?
            ###################################################################
            # Remove role-based restrictions that conflict with Developer
            # access, including "No one" and Maintainer-only entries.
            #
            # Deploy-key, user, and group-specific rules are left untouched.
            ###################################################################

            push_access_levels
              .where.not(access_level: nil)
              .where.not(access_level: developer_access)
              .find_each do |access_level|
                result[:conflicting_push_levels_removed] <<
                  access_level.access_level

                access_level.destroy!
              end

            push_access_levels.create!(
              access_level: developer_access
            )

            result[:push_access_created] = true
          else
            ###################################################################
            # Remove duplicate or conflicting role-based entries while
            # preserving the desired Developer entry.
            ###################################################################

            push_access_levels
              .where.not(id: developer_push_level.id)
              .where.not(access_level: nil)
              .find_each do |access_level|
                result[:conflicting_push_levels_removed] <<
                  access_level.access_level

                access_level.destroy!
              end
          end
        end

        #######################################################################
        # Configure merge access
        #######################################################################

        if allow_developer_merge
          merge_access_levels =
            protected_branch.merge_access_levels

          developer_merge_level =
            merge_access_levels.find_by(
              access_level: developer_access
            )

          if developer_merge_level.nil?
            merge_access_levels
              .where.not(access_level: nil)
              .where.not(access_level: developer_access)
              .find_each do |access_level|
                result[:conflicting_merge_levels_removed] <<
                  access_level.access_level

                access_level.destroy!
              end

            merge_access_levels.create!(
              access_level: developer_access
            )

            result[:merge_access_created] = true
          else
            merge_access_levels
              .where.not(id: developer_merge_level.id)
              .where.not(access_level: nil)
              .find_each do |access_level|
                result[:conflicting_merge_levels_removed] <<
                  access_level.access_level

                access_level.destroy!
              end
          end
        end

        #######################################################################
        # Keep force pushes disabled unless explicitly requested
        #######################################################################

        if protected_branch.allow_force_push != allow_force_push
          protected_branch.update!(
            allow_force_push: allow_force_push
          )

          result[:force_push_updated] = true
        end

        protected_branch.reload

        #######################################################################
        # Verify final access configuration
        #######################################################################

        if allow_developer_push
          push_verified =
            protected_branch
              .push_access_levels
              .where(
                access_level: developer_access
              )
              .exists?

          raise(
            "Developer push access was not configured"
          ) unless push_verified
        end

        if allow_developer_merge
          merge_verified =
            protected_branch
              .merge_access_levels
              .where(
                access_level: developer_access
              )
              .exists?

          raise(
            "Developer merge access was not configured"
          ) unless merge_verified
        end

        unless protected_branch.allow_force_push == allow_force_push
          raise(
            "force-push configuration verification failed"
          )
        end

        changed =
          result[:protected_branch_created] ||
          result[:push_access_created] ||
          result[:push_access_updated] ||
          result[:merge_access_created] ||
          result[:merge_access_updated] ||
          result[:force_push_updated] ||
          !result[:conflicting_push_levels_removed].empty? ||
          !result[:conflicting_merge_levels_removed].empty?

        result[:existing] = !changed
      rescue StandardError => error
        result[:errors] << {
          error:
            "#{error.class}: #{error.message}"
        }
      end

      puts(
        "GITLAB_PROTECTED_BRANCH_RESULT=" +
        JSON.generate(result)
      )

      exit 1 unless result[:errors].empty?
  environment:
    GITLAB_PROJECT_PATH: >-
      image-mode/sample-rhel9-web

    GITLAB_PROTECTED_BRANCH_NAME: main

    GITLAB_ALLOW_DEVELOPER_PUSH: "true"

    GITLAB_ALLOW_DEVELOPER_MERGE: "true"

    GITLAB_ALLOW_FORCE_PUSH: "false"

  register: gitlab_protected_branch_command

  changed_when: >-
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"protected_branch_created":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"push_access_created":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"push_access_updated":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"merge_access_created":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"merge_access_updated":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"force_push_updated":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"conflicting_push_levels_removed":\s*\[(?!\])'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"conflicting_merge_levels_removed":\s*\[(?!\])'
        )
    )
    is not none

  failed_when:
    - gitlab_protected_branch_command.rc != 0

  no_log: true
