---
- name: Authenticate to IdM for identity reconciliation
  ansible.builtin.command:
    argv: [kinit, admin]
    stdin: "{{ idm_vault_admin_password }}"
  changed_when: false
  no_log: false

- name: Initialize managed user records
  ansible.builtin.set_fact:
    idm_managed_users: []

- name: Build ordinary user records
  ansible.builtin.set_fact:
    idm_managed_users: >-
      {{ idm_managed_users + [{
        'uid': item.key,
        'first_name': item.value.first_name | default(item.key),
        'last_name': item.value.last_name | default('User'),
        'groups': item.value.groups | default([]),
        'admin': false
      }] }}
  loop: "{{ lab_users | default({}) | dict2items }}"

- name: Build administrator user records
  ansible.builtin.set_fact:
    idm_managed_users: >-
      {{ idm_managed_users + [{
        'uid': item,
        'first_name': item,
        'last_name': 'User',
        'groups': [idm_admin_group],
        'admin': true
      }] }}
  loop: "{{ idm_users | default([]) }}"

- name: Validate unique managed user IDs
  ansible.builtin.assert:
    that:
      - idm_managed_users | length > 0
      - >-
        idm_managed_users | map(attribute='uid') | unique | length
        == idm_managed_users | length

- name: Build supplemental group list
  ansible.builtin.set_fact:
    idm_managed_groups: >-
      {{ idm_managed_users | map(attribute='groups') | flatten | unique | list }}

- name: Ensure supplemental groups exist
  ansible.builtin.command:
    argv: [ipa, group-add, "{{ item }}", "--desc=Ansible-managed IdM group"]
  register: idm_group_create
  changed_when: idm_group_create.rc == 0
  failed_when:
    - idm_group_create.rc != 0
    - "'already exists' not in (idm_group_create.stdout | default(''))"
    - "'already exists' not in (idm_group_create.stderr | default(''))"
  loop: "{{ idm_managed_groups }}"

- name: Ensure managed users exist
  ansible.builtin.command:
    argv:
      - ipa
      - user-add
      - "{{ item.uid }}"
      - "--first={{ item.first_name }}"
      - "--last={{ item.last_name }}"
  register: idm_user_create
  changed_when: idm_user_create.rc == 0
  failed_when:
    - idm_user_create.rc != 0
    - "'already exists' not in (idm_user_create.stdout | default(''))"
    - "'already exists' not in (idm_user_create.stderr | default(''))"
  loop: "{{ idm_managed_users }}"
  loop_control:
    label: "{{ item.uid }}"

- name: Set initial passwords only for newly created users
  ansible.builtin.command:
    argv: [ipa, passwd, "{{ item.item.uid }}"]
    stdin: |
      {{ idm_default_user_password }}
      {{ idm_default_user_password }}
  no_log: true
  changed_when: true
  loop: "{{ idm_user_create.results | default([]) }}"
  when: item.rc == 0

###############################################################################
# Reconcile subordinate UID/GID ranges for rootless Podman
###############################################################################

- name: Query subordinate ID ranges for managed users
  ansible.builtin.command:
    argv:
      - ipa
      - subid-find
      - "--owner={{ item.uid }}"
  register: idm_managed_user_subid_query
  changed_when: false
  failed_when: idm_managed_user_subid_query.rc != 0
  loop: "{{ idm_managed_users }}"
  loop_control:
    label: "{{ item.uid }}"
  when: idm_manage_user_subids | default(true) | bool

- name: Generate missing subordinate ID ranges for managed users
  ansible.builtin.command:
    argv:
      - ipa
      - subid-generate
      - "--owner={{ item.item.uid }}"
  register: idm_managed_user_subid_generate
  changed_when: idm_managed_user_subid_generate.rc == 0
  failed_when: idm_managed_user_subid_generate.rc != 0
  loop: "{{ idm_managed_user_subid_query.results | default([]) }}"
  loop_control:
    label: "{{ item.item.uid }}"
  when:
    - not item.skipped | default(false)
    - >-
      'Number of entries returned 0' in (item.stdout | default(''))
      or
      '0 subordinate ids matched' in (item.stdout | default(''))

- name: Re-query subordinate ID ranges for managed users
  ansible.builtin.command:
    argv:
      - ipa
      - subid-find
      - "--owner={{ item.uid }}"
  register: idm_managed_user_subid_validation
  changed_when: false
  failed_when: idm_managed_user_subid_validation.rc != 0
  loop: "{{ idm_managed_users }}"
  loop_control:
    label: "{{ item.uid }}"
  when: idm_manage_user_subids | default(true) | bool

- name: Validate subordinate ID ranges for managed users
  ansible.builtin.assert:
    that:
      - >-
        'Number of entries returned 0' not in (item.stdout | default(''))
      - >-
        '0 subordinate ids matched' not in (item.stdout | default(''))
      - item.stdout is search('SubUID range size:[ ]+[1-9][0-9]*')
      - item.stdout is search('SubGID range size:[ ]+[1-9][0-9]*')
    fail_msg: >-
      IdM user {{ item.item.uid }} does not have a valid subordinate UID/GID
      range after reconciliation. Output: {{ item.stdout | default('') }}
  loop: "{{ idm_managed_user_subid_validation.results | default([]) }}"
  loop_control:
    label: "{{ item.item.uid }}"
  when: not item.skipped | default(false)

###############################################################################
# Group and sudo-rule reconciliation
###############################################################################

- name: Ensure supplemental group memberships
  ansible.builtin.command:
    argv: [ipa, group-add-member, "{{ item.1 }}", "--users={{ item.0.uid }}"]
  register: idm_membership_update
  changed_when: >-
    'Number of members added 1' in (idm_membership_update.stdout | default(''))
  failed_when:
    - idm_membership_update.rc != 0
    - >-
      'already a member'
      not in (idm_membership_update.stdout | default('') | lower)
    - >-
      'already a member'
      not in (idm_membership_update.stderr | default('') | lower)
  loop: "{{ idm_managed_users | subelements('groups') }}"
  loop_control:
    label: "{{ item.0.uid }} -> {{ item.1 }}"

# FreeIPA normally adds new accounts to ipausers automatically. Reconcile the
# membership anyway, treating its rc=1 "already a member" response as success.
- name: Ensure ordinary users are members of ipausers
  ansible.builtin.command:
    argv: [ipa, group-add-member, ipausers, "--users={{ item.uid }}"]
  register: idm_ipausers_update
  changed_when: >-
    'Number of members added 1'
    in (idm_ipausers_update.stdout | default(''))
  failed_when:
    - idm_ipausers_update.rc != 0
    - >-
      'already a member'
      not in (idm_ipausers_update.stdout | default('') | lower)
    - >-
      'already a member'
      not in (idm_ipausers_update.stderr | default('') | lower)
  loop: "{{ idm_managed_users | rejectattr('admin') | list }}"
  loop_control:
    label: "{{ item.uid }}"

- name: Nest delegated administrators in built-in admins
  ansible.builtin.command:
    argv: [ipa, group-add-member, admins, "--groups={{ idm_admin_group }}"]
  register: idm_console_admin_add
  changed_when: >-
    'Number of members added 1' in (idm_console_admin_add.stdout | default(''))
  failed_when:
    - idm_console_admin_add.rc != 0
    - >-
      'already a member'
      not in (idm_console_admin_add.stdout | default('') | lower)
    - >-
      'already a member'
      not in (idm_console_admin_add.stderr | default('') | lower)

- name: Ensure the administrator sudo rule exists
  ansible.builtin.command:
    argv: [ipa, sudorule-add, "{{ idm_sudo_rule }}"]
  register: idm_sudo_create
  changed_when: idm_sudo_create.rc == 0
  failed_when:
    - idm_sudo_create.rc != 0
    - "'already exists' not in (idm_sudo_create.stdout | default(''))"
    - "'already exists' not in (idm_sudo_create.stderr | default(''))"

- name: Configure the administrator sudo rule
  ansible.builtin.command:
    argv:
      - ipa
      - sudorule-mod
      - "{{ idm_sudo_rule }}"
      - --hostcat=all
      - --cmdcat=all
  register: idm_sudo_modify
  changed_when: "'Modified Sudo Rule' in (idm_sudo_modify.stdout | default(''))"
  failed_when:
    - idm_sudo_modify.rc != 0
    - >-
      'no modifications to be performed'
      not in (idm_sudo_modify.stderr | default('') | lower)

- name: Attach delegated administrators to the sudo rule
  ansible.builtin.command:
    argv:
      - ipa
      - sudorule-add-user
      - "{{ idm_sudo_rule }}"
      - "--groups={{ idm_admin_group }}"
  register: idm_sudo_member
  changed_when: >-
    'Number of members added 1' in (idm_sudo_member.stdout | default(''))
  failed_when:
    - idm_sudo_member.rc != 0
    - "'already a member' not in (idm_sudo_member.stdout | default('') | lower)"
    - "'already a member' not in (idm_sudo_member.stderr | default('') | lower)"

