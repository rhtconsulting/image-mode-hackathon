---
###############################################################################
# Select and stage the appropriate RHEL DVD ISO for this Image Builder.
#
# AWS authentication remains on the AAP execution node. A temporary presigned
# URL allows the managed EC2 host to download the large ISO directly from S3.
###############################################################################

- name: Validate Image Builder operating system for RHEL media selection
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'RedHat'
      - ansible_distribution_major_version | int in [9, 10]
      - image_builder_rhel_media_s3_bucket | string | trim | length > 0
      - image_builder_rhel9_iso_s3_object | string | trim | length > 0
      - image_builder_rhel10_iso_s3_object | string | trim | length > 0
      - image_builder_rhel_media_directory | string | trim | length > 0
    fail_msg: >-
      RHEL media selection supports only RHEL 9 and RHEL 10 Image Builders.
      Detected {{ ansible_distribution | default('UNKNOWN') }}
      {{ ansible_distribution_version | default('UNKNOWN') }} on
      {{ inventory_hostname }}.

- name: Select RHEL installation media for the target operating system
  ansible.builtin.set_fact:
    image_builder_selected_iso_s3_object: >-
      {{
        image_builder_rhel10_iso_s3_object
        if ansible_distribution_major_version | int == 10
        else image_builder_rhel9_iso_s3_object
      }}
    image_builder_selected_iso_destination: >-
      {{
        image_builder_rhel_media_directory
        ~ '/'
        ~ (
          image_builder_rhel10_iso_destination_name
          if ansible_distribution_major_version | int == 10
          else image_builder_rhel9_iso_destination_name
        )
      }}

- name: Create RHEL installation media directory
  ansible.builtin.file:
    path: "{{ image_builder_rhel_media_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate temporary S3 URL for selected RHEL installation media
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - presign
      - >-
        s3://{{ image_builder_rhel_media_s3_bucket }}/{{ image_builder_selected_iso_s3_object }}
      - --region
      - "{{ image_builder_rhel_media_aws_region }}"
      - --expires-in
      - "{{ image_builder_rhel_media_presign_expiration | int | string }}"
  register: image_builder_rhel_media_presign
  changed_when: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Validate temporary RHEL media download URL
  ansible.builtin.assert:
    that:
      - image_builder_rhel_media_presign.rc == 0
      - image_builder_rhel_media_presign.stdout | trim is match('^https://')
    fail_msg: >-
      AAP could not create a temporary download URL for
      s3://{{ image_builder_rhel_media_s3_bucket }}/{{ image_builder_selected_iso_s3_object }}.
      Verify that the job has the AWS IAM credential attached and that it can
      perform s3:GetObject on the selected object.
  no_log: true

- name: Download selected RHEL installation media from S3
  ansible.builtin.get_url:
    url: "{{ image_builder_rhel_media_presign.stdout | trim }}"
    dest: "{{ image_builder_selected_iso_destination }}"
    owner: root
    group: root
    mode: "0644"
    timeout: "{{ image_builder_rhel_media_download_timeout | int }}"
    force: false
  register: image_builder_rhel_media_download
  no_log: false

- name: Inspect staged RHEL installation media
  ansible.builtin.stat:
    path: "{{ image_builder_selected_iso_destination }}"
  register: image_builder_rhel_media_file

- name: Validate staged RHEL installation media
  ansible.builtin.assert:
    that:
      - image_builder_rhel_media_file.stat.exists
      - image_builder_rhel_media_file.stat.isreg
      - image_builder_rhel_media_file.stat.size | int > 0
    fail_msg: >-
      The selected RHEL installation media was not staged successfully at
      {{ image_builder_selected_iso_destination }} on {{ inventory_hostname }}.

- name: Display selected RHEL installation media
  ansible.builtin.debug:
    msg:
      - "Host: {{ inventory_hostname }}"
      - "RHEL major version: {{ ansible_distribution_major_version }}"
      - >-
        S3 object:
        s3://{{ image_builder_rhel_media_s3_bucket }}/{{ image_builder_selected_iso_s3_object }}
      - "Installed ISO: {{ image_builder_selected_iso_destination }}"
      - "Size: {{ image_builder_rhel_media_file.stat.size }} bytes"

