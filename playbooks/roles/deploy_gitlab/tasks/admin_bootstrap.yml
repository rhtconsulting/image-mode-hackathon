---
# PHASE 10 | Validate GitLab and bootstrap administrators from IdM
###########################################################################

###########################################################################
# PHASE 10 | Validate GitLab services and LDAP connectivity
###########################################################################

- name: PHASE 10 | Check GitLab service status
  ansible.builtin.command:
    argv:
      - gitlab-ctl
      - status
  register: gitlab_service_status
  changed_when: false

- name: PHASE 10 | Run GitLab application check
  ansible.builtin.command:
    argv:
      - gitlab-rake
      - gitlab:check
      - SANITIZE=true
  register: gitlab_application_check
  changed_when: false

- name: PHASE 10 | Run GitLab LDAP connectivity check
  ansible.builtin.command:
    argv:
      - gitlab-rake
      - gitlab:ldap:check
  register: gitlab_ldap_check
  changed_when: false
  no_log: true

###########################################################################
# PHASE 10 | Bootstrap GitLab administrators from IdM
###########################################################################

- name: PHASE 10 | Bootstrap GitLab administrators from IdM
  when: gitlab_idm_admin_bootstrap_enabled | bool
  block:
    #######################################################################
    # Create secure LDAP bind-password file
    #######################################################################

    - name: PHASE 10 | Create temporary LDAP bind-password file
      ansible.builtin.tempfile:
        state: file
        path: /run
        prefix: gitlab-admin-bootstrap-ldap-
      register: gitlab_admin_bootstrap_password_file
      no_log: true

    - name: PHASE 10 | Store LDAP bind password securely
      ansible.builtin.copy:
        content: "{{ gitlab_ldap_bind_password }}"
        dest: "{{ gitlab_admin_bootstrap_password_file.path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    #######################################################################
    # Query IdM administrator group membership
    #######################################################################

    - name: PHASE 10 | Query IdM administrator group members
      ansible.builtin.command:
        argv:
          - ldapsearch
          - -LLL
          - -o
          - ldif-wrap=no
          - -x
          - -H
          - "ldaps://{{ gitlab_ldap_host }}:{{ gitlab_ldap_port }}"
          - -D
          - "{{ gitlab_ldap_bind_dn }}"
          - -y
          - "{{ gitlab_admin_bootstrap_password_file.path }}"
          - -b
          - "{{ gitlab_ldap_admin_group_dn }}"
          - -s
          - base
          - "(objectClass=*)"
          - cn
          - member
      register: gitlab_idm_admin_group_members
      changed_when: false
      no_log: true

    - name: PHASE 10 | Extract IdM administrator user DNs
      ansible.builtin.set_fact:
        gitlab_idm_admin_member_dns: >-
          {{
            gitlab_idm_admin_group_members.stdout_lines
            | select('match', '^member: ')
            | map('regex_replace', '^member: ', '')
            | select(
                'match',
                '^uid=[^,]+,cn=users,cn=accounts,'
              )
            | list
            | unique
            | sort
          }}
      no_log: true

    - name: PHASE 10 | Validate IdM administrator membership
      ansible.builtin.assert:
        that:
          - gitlab_idm_admin_member_dns | length > 0
        fail_msg: >-
          IdM group {{ gitlab_ldap_admin_group_dn }} exists, but no direct
          IdM user members were found. Add users directly to the group or
          update this query to support the desired nested-group model.

    #######################################################################
    # Query required IdM attributes for every administrator
    #######################################################################

    - name: PHASE 10 | Query IdM administrator user attributes
      ansible.builtin.command:
        argv:
          - ldapsearch
          - -LLL
          - -o
          - ldif-wrap=no
          - -x
          - -H
          - "ldaps://{{ gitlab_ldap_host }}:{{ gitlab_ldap_port }}"
          - -D
          - "{{ gitlab_ldap_bind_dn }}"
          - -y
          - "{{ gitlab_admin_bootstrap_password_file.path }}"
          - -b
          - "{{ item }}"
          - -s
          - base
          - "(objectClass=*)"
          - uid
          - cn
          - givenName
          - sn
          - mail
      loop: "{{ gitlab_idm_admin_member_dns }}"
      loop_control:
        label: >-
          {{
            item
            | regex_replace(
                '^uid=([^,]+),.*$',
                '\1'
              )
          }}
      register: gitlab_idm_admin_user_attribute_queries
      changed_when: false
      no_log: true

    - name: PHASE 10 | Initialize IdM administrator definition list
      ansible.builtin.set_fact:
        gitlab_idm_admin_users: []
      no_log: true

    - name: PHASE 10 | Build IdM administrator definitions
      ansible.builtin.set_fact:
        gitlab_idm_admin_users: >-
          {{
            gitlab_idm_admin_users
            +
            [
              {
                'username': (
                  item.stdout
                  | regex_findall('(?m)^uid: (.+)$')
                  | first
                  | default('')
                  | trim
                  | lower
                ),
                'name': (
                  item.stdout
                  | regex_findall('(?m)^cn: (.+)$')
                  | first
                  | default('')
                  | trim
                ),
                'email': (
                  item.stdout
                  | regex_findall('(?m)^mail: (.+)$')
                  | first
                  | default('')
                  | trim
                  | lower
                ),
                'dn': (
                  item.item
                  | trim
                )
              }
            ]
          }}
      loop: "{{ gitlab_idm_admin_user_attribute_queries.results }}"
      loop_control:
        label: >-
          {{
            item.item
            | regex_replace(
                '^uid=([^,]+),.*$',
                '\1'
              )
          }}
      no_log: true

    - name: PHASE 10 | Validate IdM administrator definitions
      ansible.builtin.assert:
        that:
          - item.username | length > 0
          - item.name | length > 0
          - item.email | length > 0
          - item.email is search('@')
          - item.dn | length > 0
          - item.dn is match('^uid=[^,]+,cn=users,cn=accounts,')
        fail_msg: >-
          The IdM administrator entry for
          {{ item.dn | default('unknown DN') }} does not contain the uid,
          cn, mail, and DN attributes required to initialize a GitLab LDAP
          account. Ensure every IdM administrator has a valid mail
          attribute.
      loop: "{{ gitlab_idm_admin_users }}"
      loop_control:
        label: "{{ item.username | default('unknown') }}"
      no_log: true

    - name: PHASE 10 | Validate unique IdM administrator identities
      ansible.builtin.assert:
        that:
          - >-
            (
              gitlab_idm_admin_users
              | map(attribute='username')
              | list
              | unique
              | length
            )
            ==
            (
              gitlab_idm_admin_users
              | length
            )
          - >-
            (
              gitlab_idm_admin_users
              | map(attribute='email')
              | list
              | unique
              | length
            )
            ==
            (
              gitlab_idm_admin_users
              | length
            )
          - >-
            (
              gitlab_idm_admin_users
              | map(attribute='dn')
              | list
              | unique
              | length
            )
            ==
            (
              gitlab_idm_admin_users
              | length
            )
        fail_msg: >-
          IdM administrator usernames, email addresses, and LDAP DNs must
          each be unique before GitLab accounts can be initialized.
      no_log: true

    #######################################################################
    # Create default GitLab groups and initialize LDAP administrators
    #######################################################################

    - name: PHASE 10 | Initialize GitLab groups and IdM administrators
      ansible.builtin.command:
        argv:
          - gitlab-rails
          - runner
          - "-"
      args:
        stdin: |
          require "json"
          require "securerandom"
    
          ldap_provider =
            ENV.fetch("GITLAB_LDAP_PROVIDER").to_s.strip
    
          administrator_definitions =
            JSON.parse(
              ENV.fetch("GITLAB_IDM_ADMIN_USERS_JSON")
            )
    
          group_definitions =
            JSON.parse(
              ENV.fetch("GITLAB_DEFAULT_GROUPS_JSON")
            )
    
          reconcile_admin_removals =
            ENV.fetch(
              "RECONCILE_ADMIN_REMOVALS",
              "false"
            ) == "true"
    
          result = {
            groups_created: [],
            groups_updated: [],
            groups_existing: [],
            users_created: [],
            users_updated: [],
            users_existing: [],
            users_promoted: [],
            identities_created: [],
            identities_updated: [],
            identities_existing: [],
            memberships_created: [],
            memberships_updated: [],
            memberships_existing: [],
            administrators_demoted: [],
            errors: []
          }
    
          actor =
            User.find_by(username: "root") ||
            User.where(admin: true).first
    
          raise "No GitLab administrator account exists" unless actor
    
          visibility_levels = {
            "private" => Gitlab::VisibilityLevel::PRIVATE,
            "internal" => Gitlab::VisibilityLevel::INTERNAL,
            "public" => Gitlab::VisibilityLevel::PUBLIC
          }
    
          #####################################################################
          # Create or reconcile the default GitLab groups
          #####################################################################
    
          groups = {}
    
          group_definitions.each do |definition|
            path =
              definition.fetch("path").to_s.strip
    
            name =
              definition.fetch("name").to_s.strip
    
            description =
              definition.fetch(
                "description",
                ""
              ).to_s
    
            configured_visibility_name =
              definition.fetch(
                "visibility",
                "internal"
              ).to_s.strip.downcase
    
            begin
              raise "group path is empty" if path.empty?
              raise "group name is empty" if name.empty?
    
              unless visibility_levels.key?(configured_visibility_name)
                raise(
                  "unsupported group visibility " \
                  "#{configured_visibility_name.inspect}"
                )
              end
    
              configured_visibility =
                visibility_levels.fetch(
                  configured_visibility_name
                )
    
              group =
                Group.find_by_full_path(path)
    
              if group.nil?
                group = Group.new(
                  name: name,
                  path: path,
                  description: description,
                  visibility_level: configured_visibility,
                  project_creation_level:
                    Gitlab::Access::DEVELOPER
                )
    
                if group.respond_to?(:organization_id=) &&
                   defined?(Organizations::Organization)
                  organization =
                    Organizations::Organization.default_organization
    
                  organization ||=
                    Organizations::Organization.first
    
                  group.organization_id =
                    organization.id if organization
                end
    
                group.save!
    
                result[:groups_created] << path
              else
                changed = false
    
                if group.name != name
                  group.name = name
                  changed = true
                end
    
                if group.description.to_s != description
                  group.description = description
                  changed = true
                end
    
                #################################################################
                # A group cannot be less visible than a project it contains.
                #
                # The effective desired visibility is the most permissive of:
                #
                # - the configured group visibility
                # - the highest visibility of an existing direct project
                # - the group's current visibility
                #
                # Including current visibility prevents this bootstrap task from
                # unexpectedly reducing a group that another task intentionally
                # made more visible.
                #################################################################
    
                direct_project_visibility_levels =
                  group.projects.pluck(
                    :visibility_level
                  ).map(&:to_i)
    
                highest_project_visibility =
                  direct_project_visibility_levels.max ||
                  Gitlab::VisibilityLevel::PRIVATE
    
                effective_visibility =
                  [
                    configured_visibility.to_i,
                    highest_project_visibility.to_i,
                    group.visibility_level.to_i
                  ].max
    
                if group.visibility_level.to_i !=
                   effective_visibility
                  group.visibility_level =
                    effective_visibility
    
                  changed = true
                end
    
                if group.respond_to?(:project_creation_level) &&
                   group.project_creation_level.to_i !=
                   Gitlab::Access::DEVELOPER
                  group.project_creation_level =
                    Gitlab::Access::DEVELOPER
    
                  changed = true
                end
    
                if changed
                  group.save!
                  result[:groups_updated] << path
                else
                  result[:groups_existing] << path
                end
              end
    
              groups[path] = group
            rescue StandardError => error
              result[:errors] << {
                object: path,
                operation: "reconcile_group",
                error:
                  "#{error.class}: #{error.message}"
              }
            end
          end
    
          #####################################################################
          # Create, link, and promote every IdM administrator
          #####################################################################
    
          administrator_definitions.each do |definition|
            username =
              definition.fetch("username")
                        .to_s
                        .strip
                        .downcase
    
            name =
              definition.fetch("name")
                        .to_s
                        .strip
    
            email =
              definition.fetch("email")
                        .to_s
                        .strip
                        .downcase
    
            extern_uid =
              definition.fetch("dn")
                        .to_s
                        .strip
    
            begin
              raise "username is empty" if username.empty?
              raise "name is empty" if name.empty?
              raise "email is empty" if email.empty?
              raise "LDAP DN is empty" if extern_uid.empty?
    
              identity =
                Identity.find_by(
                  provider: ldap_provider,
                  extern_uid: extern_uid
                )
    
              username_user =
                User.find_by(
                  "lower(username) = ?",
                  username
                )
    
              email_user =
                User.find_by(
                  "lower(email) = ?",
                  email
                )
    
              user =
                identity&.user ||
                username_user ||
                email_user
    
              conflicting_users =
                [
                  identity&.user,
                  username_user,
                  email_user
                ].compact.uniq
    
              if conflicting_users.length > 1
                raise(
                  "username, email, and LDAP identity resolve " \
                  "to different GitLab users"
                )
              end
    
              if user.nil?
                generated_password =
                  SecureRandom.base64(48)
    
                user_attributes = {
                  username: username,
                  name: name,
                  email: email,
                  password: generated_password,
                  password_confirmation:
                    generated_password,
                  admin: true,
                  skip_confirmation: true
                }
    
                if defined?(Organizations::Organization)
                  organization =
                    Organizations::Organization.default_organization
    
                  organization ||=
                    Organizations::Organization.first
    
                  user_attributes[:organization_id] =
                    organization.id if organization
                end
    
                if defined?(Users::CreateService)
                  response =
                    Users::CreateService
                      .new(actor, user_attributes)
                      .execute
    
                  if response.respond_to?(:success?)
                    unless response.success?
                      message =
                        if response.respond_to?(:message)
                          response.message
                        else
                          response.to_s
                        end
    
                      raise(
                        "Users::CreateService failed: #{message}"
                      )
                    end
    
                    payload =
                      response.respond_to?(:payload) ?
                        response.payload :
                        nil
    
                    user =
                      if payload.is_a?(Hash)
                        payload[:user] ||
                          payload["user"]
                      elsif payload.is_a?(User)
                        payload
                      end
                  elsif response.is_a?(User)
                    user = response
                  end
                end
    
                if user.nil?
                  user = User.new(
                    username: username,
                    name: name,
                    email: email,
                    password: generated_password,
                    password_confirmation:
                      generated_password,
                    admin: true
                  )
    
                  if user.respond_to?(
                    :assign_personal_namespace
                  ) &&
                     defined?(Organizations::Organization)
                    organization =
                      Organizations::Organization.default_organization
    
                    organization ||=
                      Organizations::Organization.first
    
                    if organization
                      user.assign_personal_namespace(
                        organization
                      )
                    end
                  end
    
                  user.skip_confirmation!
                  user.save!
                end
    
                raise(
                  "GitLab user creation returned no user"
                ) unless user
    
                result[:users_created] << username
              else
                user_changed = false
    
                if user.username.downcase != username
                  raise(
                    "GitLab user #{user.username} conflicts " \
                    "with IdM username #{username}"
                  )
                end
    
                if user.email.downcase != email
                  raise(
                    "GitLab user #{username} has email " \
                    "#{user.email}, but IdM specifies #{email}"
                  )
                end
    
                if user.name != name
                  user.name = name
                  user_changed = true
                end
    
                unless user.admin?
                  user.admin = true
                  user_changed = true
                  result[:users_promoted] << username
                end
    
                if user.respond_to?(:confirmed?) &&
                   !user.confirmed?
                  user.skip_confirmation!
                  user.confirm
                  user_changed = true
                end
    
                if user_changed
                  user.save!
                  result[:users_updated] << username
                else
                  result[:users_existing] << username
                end
              end
    
              unless user.admin?
                user.update!(admin: true)
    
                unless result[:users_promoted].include?(username)
                  result[:users_promoted] << username
                end
              end
    
              #################################################################
              # Reconcile the LDAP identity
              #################################################################
    
              ldap_identity =
                user.identities.find_by(
                  provider: ldap_provider
                )
    
              if ldap_identity
                if ldap_identity.extern_uid != extern_uid
                  conflicting_identity =
                    Identity.find_by(
                      provider: ldap_provider,
                      extern_uid: extern_uid
                    )
    
                  if conflicting_identity &&
                     conflicting_identity.user_id != user.id
                    raise(
                      "LDAP identity #{extern_uid} is " \
                      "already linked to GitLab user ID " \
                      "#{conflicting_identity.user_id}"
                    )
                  end
    
                  ldap_identity.update!(
                    extern_uid: extern_uid
                  )
    
                  result[:identities_updated] << username
                else
                  result[:identities_existing] << username
                end
              else
                conflicting_identity =
                  Identity.find_by(
                    provider: ldap_provider,
                    extern_uid: extern_uid
                  )
    
                if conflicting_identity &&
                   conflicting_identity.user_id != user.id
                  raise(
                    "LDAP identity #{extern_uid} is already " \
                    "linked to GitLab user ID " \
                    "#{conflicting_identity.user_id}"
                  )
                end
    
                user.identities.create!(
                  provider: ldap_provider,
                  extern_uid: extern_uid
                )
    
                result[:identities_created] << username
              end
    
              #################################################################
              # Ensure every administrator remains Owner of each default group
              #################################################################
    
              groups.each do |group_path, group|
                membership =
                  group.members.find_by(
                    user_id: user.id
                  )
    
                if membership.nil?
                  group.add_owner(user)
    
                  result[:memberships_created] << {
                    username: username,
                    group: group_path,
                    access_level:
                      Gitlab::Access::OWNER
                  }
                elsif membership.access_level.to_i !=
                      Gitlab::Access::OWNER
                  membership.update!(
                    access_level:
                      Gitlab::Access::OWNER
                  )
    
                  result[:memberships_updated] << {
                    username: username,
                    group: group_path,
                    access_level:
                      Gitlab::Access::OWNER
                  }
                else
                  result[:memberships_existing] << {
                    username: username,
                    group: group_path,
                    access_level:
                      Gitlab::Access::OWNER
                  }
                end
              end
            rescue StandardError => error
              result[:errors] << {
                object: username,
                operation:
                  "initialize_idm_administrator",
                error:
                  "#{error.class}: #{error.message}"
              }
            end
          end
    
          #####################################################################
          # Optionally demote LDAP administrators removed from IdM
          #####################################################################
    
          if reconcile_admin_removals
            expected_usernames =
              administrator_definitions
                .map do |definition|
                  definition.fetch("username")
                            .to_s
                            .strip
                            .downcase
                end
                .uniq
    
            User
              .joins(:identities)
              .where(
                identities: {
                  provider: ldap_provider
                },
                admin: true
              )
              .where
              .not(
                username: expected_usernames
              )
              .find_each do |user|
                next if user.username == "root"
    
                user.update!(admin: false)
    
                result[:administrators_demoted] <<
                  user.username
              end
          end
    
          puts(
            "GITLAB_IDM_BOOTSTRAP_RESULT=" +
            JSON.generate(result)
          )
    
          exit 1 unless result[:errors].empty?
      environment:
        GITLAB_LDAP_PROVIDER: "{{ gitlab_ldap_provider }}"
    
        GITLAB_IDM_ADMIN_USERS_JSON: >-
          {{ gitlab_idm_admin_users | to_json }}
    
        GITLAB_DEFAULT_GROUPS_JSON: >-
          {{
            [
              {
                'name': 'Red Hat Consulting',
                'path': 'redhat-consulting',
                'description': (
                  'Shared namespace for Red Hat consulting projects.'
                ),
                'visibility': 'internal'
              },
              {
                'name': 'Image Mode',
                'path': 'image-mode',
                'description': (
                  'Shared namespace for Image Mode development projects.'
                ),
                'visibility': 'public'
              }
            ]
            | to_json
          }}
    
        RECONCILE_ADMIN_REMOVALS: >-
          {{
            gitlab_idm_admin_reconcile_removals
            | bool
            | lower
          }}
      register: gitlab_idm_bootstrap_command
    
      changed_when: >-
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"groups_created":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"groups_updated":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"users_created":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"users_updated":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"users_promoted":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"identities_created":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"identities_updated":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"memberships_created":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"memberships_updated":\s*\[(?!\])'
            )
        )
        is not none
        or
        (
          gitlab_idm_bootstrap_command.stdout
          | regex_search(
              '"administrators_demoted":\s*\[(?!\])'
            )
        )
        is not none
    
      failed_when:
        - gitlab_idm_bootstrap_command.rc != 0

    - name: PHASE 10 | Extract GitLab IdM bootstrap result
      ansible.builtin.set_fact:
        gitlab_idm_bootstrap_result: >-
          {{
            (
              gitlab_idm_bootstrap_command.stdout_lines
              | select(
                  'match',
                  '^GITLAB_IDM_BOOTSTRAP_RESULT='
                )
              | map(
                  'regex_replace',
                  '^GITLAB_IDM_BOOTSTRAP_RESULT=',
                  ''
                )
              | first
            )
            | from_json
          }}
      no_log: false

    - name: PHASE 10 | Validate GitLab IdM bootstrap result
      ansible.builtin.assert:
        that:
          - gitlab_idm_bootstrap_result.groups_created is defined
          - gitlab_idm_bootstrap_result.groups_updated is defined
          - gitlab_idm_bootstrap_result.groups_existing is defined
          - gitlab_idm_bootstrap_result.users_created is defined
          - gitlab_idm_bootstrap_result.users_existing is defined
          - gitlab_idm_bootstrap_result.users_promoted is defined
          - gitlab_idm_bootstrap_result.identities_created is defined
          - gitlab_idm_bootstrap_result.identities_existing is defined
          - gitlab_idm_bootstrap_result.memberships_created is defined
          - gitlab_idm_bootstrap_result.memberships_updated is defined
          - gitlab_idm_bootstrap_result.memberships_existing is defined
          - gitlab_idm_bootstrap_result.errors is defined
          - gitlab_idm_bootstrap_result.errors | length == 0
        fail_msg: >-
          GitLab IdM administrator initialization did not return the
          expected successful structured result.
      no_log: true

    #######################################################################
    # Verify accounts, LDAP identities, administrator roles, and groups
    #######################################################################

    - name: PHASE 10 | Verify initialized GitLab administrators
      ansible.builtin.command:
        argv:
          - gitlab-rails
          - runner
          - "-"
      args:
        stdin: |
          require "json"

          ldap_provider =
            ENV.fetch("GITLAB_LDAP_PROVIDER")

          expected_users =
            JSON.parse(
              ENV.fetch("GITLAB_IDM_ADMIN_USERS_JSON")
            )

          expected_group_paths =
            JSON.parse(
              ENV.fetch("GITLAB_DEFAULT_GROUP_PATHS_JSON")
            )

          result = {
            verified: [],
            errors: []
          }

          expected_group_paths.each do |group_path|
            group =
              Group.find_by_full_path(group_path)

            unless group
              result[:errors] << {
                object: group_path,
                error: "GitLab group does not exist"
              }

              next
            end

            if group.respond_to?(:project_creation_level) &&
               group.project_creation_level !=
               Gitlab::Access::DEVELOPER
              result[:errors] << {
                object: group_path,
                error:
                  "project creation level is not Developer"
              }
            end
          end

          expected_users.each do |definition|
            username =
              definition.fetch("username")
                        .to_s
                        .strip
                        .downcase

            email =
              definition.fetch("email")
                        .to_s
                        .strip
                        .downcase

            extern_uid =
              definition.fetch("dn")
                        .to_s
                        .strip

            begin
              user =
                User.find_by(
                  "lower(username) = ?",
                  username
                )

              raise(
                "GitLab user does not exist"
              ) unless user

              raise(
                "GitLab user email does not match IdM"
              ) unless user.email.downcase == email

              raise(
                "GitLab user is not an administrator"
              ) unless user.admin?

              identity =
                user.identities.find_by(
                  provider: ldap_provider,
                  extern_uid: extern_uid
                )

              raise(
                "#{ldap_provider} identity is missing"
              ) unless identity

              expected_group_paths.each do |group_path|
                group =
                  Group.find_by_full_path(group_path)

                raise(
                  "GitLab group #{group_path} is missing"
                ) unless group

                membership =
                  group.members.find_by(
                    user_id: user.id
                  )

                raise(
                  "user is not a direct member of " \
                  "#{group_path}"
                ) unless membership

                unless membership.access_level ==
                       Gitlab::Access::OWNER
                  raise(
                    "user is not Owner of #{group_path}; " \
                    "access_level=" \
                    "#{membership.access_level}"
                  )
                end
              end

              result[:verified] << username
            rescue StandardError => error
              result[:errors] << {
                object: username,
                error:
                  "#{error.class}: #{error.message}"
              }
            end
          end

          puts(
            "GITLAB_IDM_BOOTSTRAP_VERIFICATION=" +
            JSON.generate(result)
          )

          exit 1 unless result[:errors].empty?
      environment:
        GITLAB_LDAP_PROVIDER: "{{ gitlab_ldap_provider }}"
        GITLAB_IDM_ADMIN_USERS_JSON: >-
          {{ gitlab_idm_admin_users | to_json }}
        GITLAB_DEFAULT_GROUP_PATHS_JSON: >-
          {{
            [
              'redhat-consulting',
              'image-mode'
            ]
            | to_json
          }}
      register: gitlab_idm_bootstrap_verification_command
      changed_when: false
      no_log: true

    - name: PHASE 10 | Extract GitLab IdM bootstrap verification
      ansible.builtin.set_fact:
        gitlab_idm_bootstrap_verification: >-
          {{
            (
              gitlab_idm_bootstrap_verification_command.stdout_lines
              | select(
                  'match',
                  '^GITLAB_IDM_BOOTSTRAP_VERIFICATION='
                )
              | map(
                  'regex_replace',
                  '^GITLAB_IDM_BOOTSTRAP_VERIFICATION=',
                  ''
                )
              | first
            )
            | from_json
          }}
      no_log: true


    - name: PHASE 10 | Assert all IdM administrators were initialized
      ansible.builtin.assert:
        that:
          - gitlab_idm_bootstrap_verification.errors | length == 0
          - >-
            (
              gitlab_idm_bootstrap_verification.verified
              | sort
            )
            ==
            (
              gitlab_idm_admin_users
              | map(attribute='username')
              | list
              | sort
            )
        fail_msg: >-
          One or more IdM administrators were not initialized correctly as
          GitLab LDAP administrators and Owners of the default groups.
      no_log: true

    #######################################################################
    # Report completed bootstrap
    #######################################################################

    - name: PHASE 10 | Report GitLab IdM administrator bootstrap
      ansible.builtin.debug:
        msg:
          - >-
            IdM administrator group:
            {{ gitlab_ldap_admin_group_dn }}
          - >-
            LDAP provider:
            {{ gitlab_ldap_provider }}
          - >-
            Initialized GitLab administrators:
            {{
              gitlab_idm_bootstrap_verification.verified
              | join(', ')
            }}
          - >-
            GitLab groups available:
            redhat-consulting, image-mode
          - >-
            IdM administrators are Owners of both groups and are already
            linked to LDAP. No first-login bootstrap or playbook rerun is
            required.
          - >-
            Members with Developer access can create projects in these
            groups because their project creation level is Developer.

  always:
    - name: PHASE 10 | Remove temporary LDAP bind-password file
      ansible.builtin.file:
        path: "{{ gitlab_admin_bootstrap_password_file.path }}"
        state: absent
      when:
        - gitlab_admin_bootstrap_password_file is defined
        - gitlab_admin_bootstrap_password_file.path is defined
      no_log: true

- name: PHASE 10 | Report disabled IdM administrator bootstrap
  ansible.builtin.debug:
    msg: >-
      GitLab administrator bootstrap from IdM is disabled by
      gitlab_idm_admin_bootstrap_enabled=false.
  when: not gitlab_idm_admin_bootstrap_enabled | bool

###########################################################################
###############################################################################
# PHASE 11 | Bootstrap all IdM developers into GitLab
###############################################################################

- name: PHASE 11 | Bootstrap GitLab developers from IdM
  when: gitlab_idm_developer_bootstrap_enabled | bool
  block:
    ###########################################################################
    # Create secure LDAP bind-password file
    ###########################################################################

    - name: PHASE 11 | Create temporary LDAP bind-password file
      ansible.builtin.tempfile:
        state: file
        path: /run
        prefix: gitlab-developer-bootstrap-ldap-
      register: gitlab_developer_bootstrap_password_file
      no_log: true

    - name: PHASE 11 | Store LDAP bind password securely
      ansible.builtin.copy:
        content: "{{ gitlab_ldap_bind_password }}"
        dest: "{{ gitlab_developer_bootstrap_password_file.path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    ###########################################################################
    # Query every eligible IdM user
    ###########################################################################

    - name: PHASE 11 | Query eligible IdM users
      ansible.builtin.command:
        argv:
          - ldapsearch
          - -LLL
          - -o
          - ldif-wrap=no
          - -x
          - -H
          - "ldaps://{{ gitlab_ldap_host }}:{{ gitlab_ldap_port }}"
          - -D
          - "{{ gitlab_ldap_bind_dn }}"
          - -y
          - "{{ gitlab_developer_bootstrap_password_file.path }}"
          - -b
          - "{{ gitlab_ldap_user_base_dn }}"
          - -s
          - one
          - "{{ gitlab_idm_developer_user_filter | regex_replace('\\s+', '') }}"
          - dn
          - uid
          - cn
          - mail
      register: gitlab_idm_developer_ldap_query
      changed_when: false
      no_log: false

    ###########################################################################
    # Parse LDAP LDIF records
    ###########################################################################

    - name: PHASE 11 | Parse eligible IdM user records
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json
            import sys

            records = []
            current = {}

            for raw_line in sys.stdin.read().splitlines():
                line = raw_line.strip()

                if not line:
                    if current:
                        records.append(current)
                        current = {}
                    continue

                if ": " not in line:
                    continue

                key, value = line.split(": ", 1)
                key = key.lower()

                if key in {"dn", "uid", "cn", "mail"}:
                    current[key] = value.strip()

            if current:
                records.append(current)

            normalized = []

            for record in records:
                username = record.get("uid", "").strip().lower()
                name = record.get("cn", "").strip()
                email = record.get("mail", "").strip().lower()
                dn = record.get("dn", "").strip()

                if not username:
                    continue

                normalized.append(
                    {
                        "username": username,
                        "name": name,
                        "email": email,
                        "dn": dn,
                    }
                )

            normalized.sort(key=lambda item: item["username"])

            print(json.dumps(normalized))
      args:
        stdin: "{{ gitlab_idm_developer_ldap_query.stdout }}"
      register: gitlab_idm_developer_parser
      changed_when: false
      no_log: true

    - name: PHASE 11 | Store eligible IdM user definitions
      ansible.builtin.set_fact:
        gitlab_idm_all_user_definitions: >-
          {{ gitlab_idm_developer_parser.stdout | from_json }}
      no_log: true

    - name: PHASE 11 | Validate eligible IdM user definitions
      ansible.builtin.assert:
        that:
          - gitlab_idm_all_user_definitions | length > 0
          - item.username | length > 0
          - item.name | length > 0
          - item.email | length > 0
          - item.email is search('@')
          - item.dn | length > 0
          - item.dn is match('^uid=[^,]+,cn=users,cn=accounts,')
        fail_msg: >-
          The IdM user {{ item.username | default('unknown') }} does not
          contain the uid, cn, mail, and DN attributes required to initialize
          a GitLab LDAP account.
      loop: "{{ gitlab_idm_all_user_definitions }}"
      loop_control:
        label: "{{ item.username | default('unknown') }}"
      no_log: true

    ###########################################################################
    # Build administrator exclusion lists
    #
    # gitlab_idm_admin_users was created by Phase 10.
    ###########################################################################

    - name: PHASE 11 | Build IdM administrator exclusion lists
      ansible.builtin.set_fact:
        gitlab_idm_admin_usernames_resolved: >-
          {{
            gitlab_idm_admin_users
            | default([])
            | map(attribute='username')
            | map('lower')
            | list
            | unique
          }}
        gitlab_idm_admin_dns_resolved: >-
          {{
            gitlab_idm_admin_users
            | default([])
            | map(attribute='dn')
            | list
            | unique
          }}
      no_log: true

    - name: PHASE 11 | Build ordinary IdM developer definitions
      ansible.builtin.set_fact:
        gitlab_idm_developer_users: >-
          {%- set developers = [] -%}
          {%- for user in gitlab_idm_all_user_definitions -%}
          {%-   set is_admin =
                  (
                    user.username
                    in gitlab_idm_admin_usernames_resolved
                  )
                  or
                  (
                    user.dn
                    in gitlab_idm_admin_dns_resolved
                  )
          -%}
          {%-   if
                  (
                    not gitlab_idm_developer_exclude_administrators
                  )
                  or
                  (
                    not is_admin
                  )
          -%}
          {%-     set _ = developers.append(user) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ developers }}
      no_log: true

    - name: PHASE 11 | Validate administrator exclusion
      ansible.builtin.assert:
        that:
          - >-
            (
              gitlab_idm_developer_users
              | map(attribute='username')
              | list
              | intersect(gitlab_idm_admin_usernames_resolved)
              | length
            )
            == 0
        fail_msg: >-
          One or more IdM administrators remain in the ordinary developer
          definition list.
      when: gitlab_idm_developer_exclude_administrators | bool
      no_log: true

    ###########################################################################
    # Pre-create users, link LDAP identities, and grant Developer access
    ###########################################################################

    - name: PHASE 11 | Initialize GitLab IdM developers
      ansible.builtin.command:
        argv:
          - gitlab-rails
          - runner
          - "-"
      args:
        stdin: |
          require "json"
          require "securerandom"

          ldap_provider =
            ENV.fetch("GITLAB_LDAP_PROVIDER").to_s.strip

          developer_definitions =
            JSON.parse(
              ENV.fetch("GITLAB_IDM_DEVELOPER_USERS_JSON")
            )

          administrator_usernames =
            JSON.parse(
              ENV.fetch("GITLAB_IDM_ADMIN_USERNAMES_JSON")
            ).map do |username|
              username.to_s.strip.downcase
            end

          target_group_path =
            ENV.fetch("GITLAB_DEVELOPER_GROUP_PATH")
               .to_s
               .strip

          target_project_path =
            ENV.fetch("GITLAB_DEVELOPER_PROJECT_PATH")
               .to_s
               .strip

          preserve_higher_access =
            ENV.fetch(
              "PRESERVE_HIGHER_ACCESS",
              "true"
            ) == "true"

          promote_lower_access =
            ENV.fetch(
              "PROMOTE_LOWER_ACCESS",
              "true"
            ) == "true"

          result = {
            users_created: [],
            users_updated: [],
            users_existing: [],
            identities_created: [],
            identities_updated: [],
            identities_existing: [],
            memberships_created: [],
            memberships_updated: [],
            memberships_existing: [],
            administrators_preserved: [],
            errors: []
          }

          actor =
            User.find_by(username: "root") ||
            User.where(admin: true).first

          raise "No GitLab administrator account exists" unless actor

          group =
            Group.find_by_full_path(target_group_path)

          raise(
            "GitLab group #{target_group_path.inspect} does not exist"
          ) unless group

          project =
            Project.find_by_full_path(target_project_path)

          raise(
            "GitLab project #{target_project_path.inspect} does not exist"
          ) unless project

          developer_access =
            Gitlab::Access::DEVELOPER

          developer_definitions.each do |definition|
            username =
              definition.fetch("username")
                        .to_s
                        .strip
                        .downcase

            name =
              definition.fetch("name")
                        .to_s
                        .strip

            email =
              definition.fetch("email")
                        .to_s
                        .strip
                        .downcase

            extern_uid =
              definition.fetch("dn")
                        .to_s
                        .strip

            begin
              raise "username is empty" if username.empty?
              raise "name is empty" if name.empty?
              raise "email is empty" if email.empty?
              raise "LDAP DN is empty" if extern_uid.empty?

              if administrator_usernames.include?(username)
                result[:administrators_preserved] << username
                next
              end

              identity =
                Identity.find_by(
                  provider: ldap_provider,
                  extern_uid: extern_uid
                )

              username_user =
                User.find_by(
                  "lower(username) = ?",
                  username
                )

              email_user =
                User.find_by(
                  "lower(email) = ?",
                  email
                )

              user =
                identity&.user ||
                username_user ||
                email_user

              conflicting_users =
                [
                  identity&.user,
                  username_user,
                  email_user
                ].compact.uniq

              if conflicting_users.length > 1
                raise(
                  "username, email, and LDAP identity resolve " \
                  "to different GitLab users"
                )
              end

              if user.nil?
                generated_password =
                  SecureRandom.base64(48)

                user_attributes = {
                  username: username,
                  name: name,
                  email: email,
                  password: generated_password,
                  password_confirmation:
                    generated_password,
                  admin: false,
                  skip_confirmation: true
                }

                if defined?(Organizations::Organization)
                  organization =
                    Organizations::Organization.default_organization

                  organization ||=
                    Organizations::Organization.first

                  user_attributes[:organization_id] =
                    organization.id if organization
                end

                if defined?(Users::CreateService)
                  response =
                    Users::CreateService
                      .new(actor, user_attributes)
                      .execute

                  if response.respond_to?(:success?)
                    unless response.success?
                      message =
                        if response.respond_to?(:message)
                          response.message
                        else
                          response.to_s
                        end

                      raise(
                        "Users::CreateService failed: #{message}"
                      )
                    end

                    payload =
                      response.respond_to?(:payload) ?
                        response.payload :
                        nil

                    user =
                      if payload.is_a?(Hash)
                        payload[:user] ||
                          payload["user"]
                      elsif payload.is_a?(User)
                        payload
                      end
                  elsif response.is_a?(User)
                    user = response
                  end
                end

                if user.nil?
                  user = User.new(
                    username: username,
                    name: name,
                    email: email,
                    password: generated_password,
                    password_confirmation:
                      generated_password,
                    admin: false
                  )

                  if user.respond_to?(:assign_personal_namespace) &&
                     defined?(Organizations::Organization)
                    organization =
                      Organizations::Organization.default_organization

                    organization ||=
                      Organizations::Organization.first

                    if organization
                      user.assign_personal_namespace(
                        organization
                      )
                    end
                  end

                  user.skip_confirmation!
                  user.save!
                end

                raise(
                  "GitLab user creation returned no user"
                ) unless user

                result[:users_created] << username
              else
                changed = false

                if user.username.downcase != username
                  raise(
                    "GitLab user #{user.username} conflicts with " \
                    "IdM username #{username}"
                  )
                end

                if user.email.downcase != email
                  raise(
                    "GitLab user #{username} has email #{user.email}, " \
                    "but IdM specifies #{email}"
                  )
                end

                if user.name != name
                  user.name = name
                  changed = true
                end

                if user.respond_to?(:confirmed?) &&
                   !user.confirmed?
                  user.skip_confirmation!
                  user.confirm
                  changed = true
                end

                if changed
                  user.save!
                  result[:users_updated] << username
                else
                  result[:users_existing] << username
                end
              end

              #################################################################
              # Never demote an existing GitLab administrator
              #################################################################

              if user.admin?
                result[:administrators_preserved] << username
              end

              #################################################################
              # Create or repair LDAP identity
              #################################################################

              ldap_identity =
                user.identities.find_by(
                  provider: ldap_provider
                )

              if ldap_identity
                if ldap_identity.extern_uid != extern_uid
                  conflicting_identity =
                    Identity.find_by(
                      provider: ldap_provider,
                      extern_uid: extern_uid
                    )

                  if conflicting_identity &&
                     conflicting_identity.user_id != user.id
                    raise(
                      "LDAP identity #{extern_uid} is already linked " \
                      "to GitLab user ID " \
                      "#{conflicting_identity.user_id}"
                    )
                  end

                  ldap_identity.update!(
                    extern_uid: extern_uid
                  )

                  result[:identities_updated] << username
                else
                  result[:identities_existing] << username
                end
              else
                conflicting_identity =
                  Identity.find_by(
                    provider: ldap_provider,
                    extern_uid: extern_uid
                  )

                if conflicting_identity &&
                   conflicting_identity.user_id != user.id
                  raise(
                    "LDAP identity #{extern_uid} is already linked " \
                    "to GitLab user ID " \
                    "#{conflicting_identity.user_id}"
                  )
                end

                user.identities.create!(
                  provider: ldap_provider,
                  extern_uid: extern_uid
                )

                result[:identities_created] << username
              end

              #################################################################
              # Grant Developer membership without reducing higher access
              #################################################################

              membership =
                group.members.find_by(
                  user_id: user.id
                )

              if membership.nil?
                group.add_member(
                  user,
                  developer_access
                )

                result[:memberships_created] << {
                  username: username,
                  group: target_group_path,
                  access_level: developer_access
                }
              elsif membership.access_level == developer_access
                result[:memberships_existing] << {
                  username: username,
                  group: target_group_path,
                  access_level: membership.access_level
                }
              elsif membership.access_level > developer_access &&
                    preserve_higher_access
                result[:memberships_existing] << {
                  username: username,
                  group: target_group_path,
                  access_level: membership.access_level
                }
              elsif membership.access_level < developer_access &&
                    promote_lower_access
                membership.update!(
                  access_level: developer_access
                )

                result[:memberships_updated] << {
                  username: username,
                  group: target_group_path,
                  access_level: developer_access
                }
              else
                result[:memberships_existing] << {
                  username: username,
                  group: target_group_path,
                  access_level: membership.access_level
                }
              end
            rescue StandardError => error
              result[:errors] << {
                object: username,
                operation: "initialize_idm_developer",
                error:
                  "#{error.class}: #{error.message}"
              }
            end
          end

          puts(
            "GITLAB_IDM_DEVELOPER_BOOTSTRAP_RESULT=" +
            JSON.generate(result)
          )

          exit 1 unless result[:errors].empty?
      environment:
        GITLAB_LDAP_PROVIDER: "{{ gitlab_ldap_provider }}"
        GITLAB_IDM_DEVELOPER_USERS_JSON: >-
          {{ gitlab_idm_developer_users | to_json }}
        GITLAB_IDM_ADMIN_USERNAMES_JSON: >-
          {{ gitlab_idm_admin_usernames_resolved | to_json }}
        GITLAB_DEVELOPER_GROUP_PATH: >-
          {{ gitlab_idm_developer_group_path }}
        GITLAB_DEVELOPER_PROJECT_PATH: >-
          {{ gitlab_idm_developer_project_path }}
        PRESERVE_HIGHER_ACCESS: >-
          {{
            gitlab_idm_developer_preserve_higher_access
            | bool
            | lower
          }}
        PROMOTE_LOWER_ACCESS: >-
          {{
            gitlab_idm_developer_promote_lower_access
            | bool
            | lower
          }}
      register: gitlab_idm_developer_bootstrap_command
      changed_when: >-
        (
          gitlab_idm_developer_bootstrap_command.stdout
          | regex_search('"users_created":\s*\[(?!\])')
        )
        is not none
        or
        (
          gitlab_idm_developer_bootstrap_command.stdout
          | regex_search('"users_updated":\s*\[(?!\])')
        )
        is not none
        or
        (
          gitlab_idm_developer_bootstrap_command.stdout
          | regex_search('"identities_created":\s*\[(?!\])')
        )
        is not none
        or
        (
          gitlab_idm_developer_bootstrap_command.stdout
          | regex_search('"identities_updated":\s*\[(?!\])')
        )
        is not none
        or
        (
          gitlab_idm_developer_bootstrap_command.stdout
          | regex_search('"memberships_created":\s*\[(?!\])')
        )
        is not none
        or
        (
          gitlab_idm_developer_bootstrap_command.stdout
          | regex_search('"memberships_updated":\s*\[(?!\])')
        )
        is not none
      no_log: true

    - name: PHASE 11 | Extract GitLab IdM developer bootstrap result
      ansible.builtin.set_fact:
        gitlab_idm_developer_bootstrap_result: >-
          {{
            (
              gitlab_idm_developer_bootstrap_command.stdout_lines
              | select(
                  'match',
                  '^GITLAB_IDM_DEVELOPER_BOOTSTRAP_RESULT='
                )
              | map(
                  'regex_replace',
                  '^GITLAB_IDM_DEVELOPER_BOOTSTRAP_RESULT=',
                  ''
                )
              | first
            )
            | from_json
          }}
      no_log: true

    - name: PHASE 11 | Validate GitLab IdM developer bootstrap
      ansible.builtin.assert:
        that:
          - gitlab_idm_developer_bootstrap_result.users_created is defined
          - gitlab_idm_developer_bootstrap_result.users_existing is defined
          - gitlab_idm_developer_bootstrap_result.identities_created is defined
          - gitlab_idm_developer_bootstrap_result.identities_existing is defined
          - gitlab_idm_developer_bootstrap_result.memberships_created is defined
          - gitlab_idm_developer_bootstrap_result.memberships_updated is defined
          - gitlab_idm_developer_bootstrap_result.memberships_existing is defined
          - gitlab_idm_developer_bootstrap_result.administrators_preserved is defined
          - gitlab_idm_developer_bootstrap_result.errors is defined
          - gitlab_idm_developer_bootstrap_result.errors | length == 0
        fail_msg: >-
          GitLab IdM developer initialization returned one or more errors.
      no_log: false

    ###########################################################################
    # Verify every ordinary IdM account has at least Developer access
    ###########################################################################

    - name: PHASE 11 | Verify initialized GitLab IdM developers
      ansible.builtin.command:
        argv:
          - gitlab-rails
          - runner
          - "-"
      args:
        stdin: |
          require "json"

          ldap_provider =
            ENV.fetch("GITLAB_LDAP_PROVIDER")

          expected_users =
            JSON.parse(
              ENV.fetch("GITLAB_IDM_DEVELOPER_USERS_JSON")
            )

          group_path =
            ENV.fetch("GITLAB_DEVELOPER_GROUP_PATH")

          project_path =
            ENV.fetch("GITLAB_DEVELOPER_PROJECT_PATH")

          result = {
            verified: [],
            errors: []
          }

          group =
            Group.find_by_full_path(group_path)

          project =
            Project.find_by_full_path(project_path)

          unless group
            result[:errors] << {
              object: group_path,
              error: "GitLab group does not exist"
            }
          end

          unless project
            result[:errors] << {
              object: project_path,
              error: "GitLab project does not exist"
            }
          end

          if group && project
            expected_users.each do |definition|
              username =
                definition.fetch("username")
                          .to_s
                          .strip
                          .downcase

              extern_uid =
                definition.fetch("dn")
                          .to_s
                          .strip

              begin
                user =
                  User.find_by(
                    "lower(username) = ?",
                    username
                  )

                raise(
                  "GitLab user does not exist"
                ) unless user

                identity =
                  user.identities.find_by(
                    provider: ldap_provider,
                    extern_uid: extern_uid
                  )

                raise(
                  "#{ldap_provider} identity is missing"
                ) unless identity

                membership =
                  group.members.find_by(
                    user_id: user.id
                  )

                raise(
                  "user is not a direct member of #{group_path}"
                ) unless membership

                if membership.access_level <
                   Gitlab::Access::DEVELOPER
                  raise(
                    "access level #{membership.access_level} is below " \
                    "Developer"
                  )
                end

                result[:verified] << username
              rescue StandardError => error
                result[:errors] << {
                  object: username,
                  error:
                    "#{error.class}: #{error.message}"
                }
              end
            end
          end

          puts(
            "GITLAB_IDM_DEVELOPER_VERIFICATION=" +
            JSON.generate(result)
          )

          exit 1 unless result[:errors].empty?
      environment:
        GITLAB_LDAP_PROVIDER: "{{ gitlab_ldap_provider }}"
        GITLAB_IDM_DEVELOPER_USERS_JSON: >-
          {{ gitlab_idm_developer_users | to_json }}
        GITLAB_DEVELOPER_GROUP_PATH: >-
          {{ gitlab_idm_developer_group_path }}
        GITLAB_DEVELOPER_PROJECT_PATH: >-
          {{ gitlab_idm_developer_project_path }}
      register: gitlab_idm_developer_verification_command
      changed_when: false
      no_log: true

    - name: PHASE 11 | Extract GitLab IdM developer verification
      ansible.builtin.set_fact:
        gitlab_idm_developer_verification: >-
          {{
            (
              gitlab_idm_developer_verification_command.stdout_lines
              | select(
                  'match',
                  '^GITLAB_IDM_DEVELOPER_VERIFICATION='
                )
              | map(
                  'regex_replace',
                  '^GITLAB_IDM_DEVELOPER_VERIFICATION=',
                  ''
                )
              | first
            )
            | from_json
          }}
      no_log: true

    - name: PHASE 11 | Assert all ordinary IdM users were initialized
      ansible.builtin.assert:
        that:
          - gitlab_idm_developer_verification.errors | length == 0
          - >-
            (
              gitlab_idm_developer_verification.verified
              | sort
            )
            ==
            (
              gitlab_idm_developer_users
              | map(attribute='username')
              | list
              | sort
            )
        fail_msg: >-
          One or more ordinary IdM users were not initialized with Developer
          access to the image-mode GitLab group.
      no_log: true

    - name: PHASE 11 | Report GitLab IdM developer bootstrap
      ansible.builtin.debug:
        msg:
          - >-
            Pre-provisioned IdM developers:
            {{
              gitlab_idm_developer_verification.verified
              | length
            }}
          - >-
            Target GitLab group:
            {{ gitlab_idm_developer_group_path }}
          - >-
            Inherited project access:
            {{ gitlab_idm_developer_project_path }}
          - >-
            All eligible IdM users were pre-created in GitLab, linked to
            {{ gitlab_ldap_provider }}, and granted at least Developer access.
          - >-
            Existing GitLab administrators and Owner or Maintainer memberships
            were preserved.
          - >-
            No first-login bootstrap or post-login playbook rerun is required.

  always:
    - name: PHASE 11 | Remove temporary LDAP bind-password file
      ansible.builtin.file:
        path: "{{ gitlab_developer_bootstrap_password_file.path }}"
        state: absent
      when:
        - gitlab_developer_bootstrap_password_file is defined
        - gitlab_developer_bootstrap_password_file.path is defined
      no_log: true

- name: PHASE 11 | Report disabled IdM developer bootstrap
  ansible.builtin.debug:
    msg: >-
      GitLab developer bootstrap from IdM is disabled by
      gitlab_idm_developer_bootstrap_enabled=false.
  when: not gitlab_idm_developer_bootstrap_enabled | bool

###############################################################################
# Configure sample-rhel9-web protected branch access
###############################################################################

- name: PHASE 11 | Allow Developers to push and merge the main branch
  ansible.builtin.command:
    argv:
      - gitlab-rails
      - runner
      - "-"
  args:
    stdin: |
      require "json"

      project_path =
        ENV.fetch(
          "GITLAB_PROJECT_PATH"
        ).to_s.strip

      branch_name =
        ENV.fetch(
          "GITLAB_PROTECTED_BRANCH_NAME",
          "main"
        ).to_s.strip

      allow_developer_push =
        ENV.fetch(
          "GITLAB_ALLOW_DEVELOPER_PUSH",
          "true"
        ) == "true"

      allow_developer_merge =
        ENV.fetch(
          "GITLAB_ALLOW_DEVELOPER_MERGE",
          "true"
        ) == "true"

      allow_force_push =
        ENV.fetch(
          "GITLAB_ALLOW_FORCE_PUSH",
          "false"
        ) == "true"

      result = {
        project: project_path,
        branch: branch_name,
        protected_branch_created: false,
        push_access_created: false,
        push_access_updated: false,
        merge_access_created: false,
        merge_access_updated: false,
        conflicting_push_levels_removed: [],
        conflicting_merge_levels_removed: [],
        force_push_updated: false,
        existing: false,
        errors: []
      }

      begin
        raise "project path is empty" if project_path.empty?
        raise "branch name is empty" if branch_name.empty?

        project =
          Project.find_by_full_path(
            project_path
          )

        raise(
          "GitLab project #{project_path.inspect} does not exist"
        ) unless project

        developer_access =
          Gitlab::Access::DEVELOPER

        protected_branch =
          project.protected_branches.find_by(
            name: branch_name
          )

        if protected_branch.nil?
          protected_branch =
            project.protected_branches.create!(
              name: branch_name,
              allow_force_push: allow_force_push
            )

          result[:protected_branch_created] = true
        end

        #######################################################################
        # Configure direct push access
        #
        # Access level 30 permits Developers and all higher roles.
        #######################################################################

        if allow_developer_push
          push_access_levels =
            protected_branch.push_access_levels

          developer_push_level =
            push_access_levels.find_by(
              access_level: developer_access
            )

          if developer_push_level.nil?
            ###################################################################
            # Remove role-based restrictions that conflict with Developer
            # access, including "No one" and Maintainer-only entries.
            #
            # Deploy-key, user, and group-specific rules are left untouched.
            ###################################################################

            push_access_levels
              .where.not(access_level: nil)
              .where.not(access_level: developer_access)
              .find_each do |access_level|
                result[:conflicting_push_levels_removed] <<
                  access_level.access_level

                access_level.destroy!
              end

            push_access_levels.create!(
              access_level: developer_access
            )

            result[:push_access_created] = true
          else
            ###################################################################
            # Remove duplicate or conflicting role-based entries while
            # preserving the desired Developer entry.
            ###################################################################

            push_access_levels
              .where.not(id: developer_push_level.id)
              .where.not(access_level: nil)
              .find_each do |access_level|
                result[:conflicting_push_levels_removed] <<
                  access_level.access_level

                access_level.destroy!
              end
          end
        end

        #######################################################################
        # Configure merge access
        #######################################################################

        if allow_developer_merge
          merge_access_levels =
            protected_branch.merge_access_levels

          developer_merge_level =
            merge_access_levels.find_by(
              access_level: developer_access
            )

          if developer_merge_level.nil?
            merge_access_levels
              .where.not(access_level: nil)
              .where.not(access_level: developer_access)
              .find_each do |access_level|
                result[:conflicting_merge_levels_removed] <<
                  access_level.access_level

                access_level.destroy!
              end

            merge_access_levels.create!(
              access_level: developer_access
            )

            result[:merge_access_created] = true
          else
            merge_access_levels
              .where.not(id: developer_merge_level.id)
              .where.not(access_level: nil)
              .find_each do |access_level|
                result[:conflicting_merge_levels_removed] <<
                  access_level.access_level

                access_level.destroy!
              end
          end
        end

        #######################################################################
        # Keep force pushes disabled unless explicitly requested
        #######################################################################

        if protected_branch.allow_force_push != allow_force_push
          protected_branch.update!(
            allow_force_push: allow_force_push
          )

          result[:force_push_updated] = true
        end

        protected_branch.reload

        #######################################################################
        # Verify final access configuration
        #######################################################################

        if allow_developer_push
          push_verified =
            protected_branch
              .push_access_levels
              .where(
                access_level: developer_access
              )
              .exists?

          raise(
            "Developer push access was not configured"
          ) unless push_verified
        end

        if allow_developer_merge
          merge_verified =
            protected_branch
              .merge_access_levels
              .where(
                access_level: developer_access
              )
              .exists?

          raise(
            "Developer merge access was not configured"
          ) unless merge_verified
        end

        unless protected_branch.allow_force_push == allow_force_push
          raise(
            "force-push configuration verification failed"
          )
        end

        changed =
          result[:protected_branch_created] ||
          result[:push_access_created] ||
          result[:push_access_updated] ||
          result[:merge_access_created] ||
          result[:merge_access_updated] ||
          result[:force_push_updated] ||
          !result[:conflicting_push_levels_removed].empty? ||
          !result[:conflicting_merge_levels_removed].empty?

        result[:existing] = !changed
      rescue StandardError => error
        result[:errors] << {
          error:
            "#{error.class}: #{error.message}"
        }
      end

      puts(
        "GITLAB_PROTECTED_BRANCH_RESULT=" +
        JSON.generate(result)
      )

      exit 1 unless result[:errors].empty?
  environment:
    GITLAB_PROJECT_PATH: >-
      image-mode/sample-rhel9-web

    GITLAB_PROTECTED_BRANCH_NAME: main

    GITLAB_ALLOW_DEVELOPER_PUSH: "true"

    GITLAB_ALLOW_DEVELOPER_MERGE: "true"

    GITLAB_ALLOW_FORCE_PUSH: "false"

  register: gitlab_protected_branch_command

  changed_when: >-
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"protected_branch_created":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"push_access_created":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"push_access_updated":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"merge_access_created":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"merge_access_updated":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"force_push_updated":true'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"conflicting_push_levels_removed":\s*\[(?!\])'
        )
    )
    is not none
    or
    (
      gitlab_protected_branch_command.stdout
      | regex_search(
          '"conflicting_merge_levels_removed":\s*\[(?!\])'
        )
    )
    is not none

  failed_when:
    - gitlab_protected_branch_command.rc != 0

  no_log: true