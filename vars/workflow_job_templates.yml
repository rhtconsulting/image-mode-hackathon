---
###############################################################################
# Image Mode workflow job templates
###############################################################################

controller_workflows:

  ###########################################################################
  # Build and deploy sample Image Mode host
  ###########################################################################

  - name: "IM | DEPLOY-AWS | 00 | WF | Deploy sample image"
    labels:
      - "image-mode"
      - "deploy-aws"
      - "workflow-entrypoint"
    description: >-
      Build the sample RHEL Image Mode container image, create and register an
      AWS AMI, publish the AMI metadata as workflow artifacts, configure the
      Satellite AWS compute-resource image to use the newly created AMI, and
      then use Satellite to create and provision the resulting EC2 host.
    organization: "Image Mode Lab"
    destroy_current_nodes: true
    survey_enabled: false

    workflow_nodes:

      #########################################################################
      # Build Image Mode AMI
      #########################################################################

      - identifier: "build_image_mode_ami"

        unified_job_template:
          name: "IM | DEPLOY-AWS | 10 | JT | Build AMI"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "configure_satellite_for_new_ami"

      #########################################################################
      # Configure Satellite for New AMI
      #########################################################################

      - identifier: "configure_satellite_for_new_ami"

        unified_job_template:
          name: "IM | DEPLOY-AWS | 20 | JT | Configure Satellite AMI"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "use_satellite_to_deploy_ec2_instances"

      #########################################################################
      # Use Satellite to deploy EC2 instances
      #########################################################################

      - identifier: "use_satellite_to_deploy_ec2_instances"

        unified_job_template:
          name: "IM | DEPLOY-AWS | 30 | JT | Deploy EC2 instance"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

  ###########################################################################
  # Provision additional Image Builder teams
  ###########################################################################

  - name: "IM | ADD-BUILDERS | 00 | WF | Provision additional builder hosts"
    labels:
      - "image-mode"
      - "add-builders"
      - "workflow-entrypoint"
    description: >-
      Create additional RHEL 9 and RHEL 10 Image Builder hosts, add the newly
      provisioned hosts to the staged AAP inventory, enroll them in IdM, and
      retain them in staging until certificate and Satellite configuration
      have completed successfully.
    organization: "Image Mode Lab"
    destroy_current_nodes: true

    survey_enabled: true
    survey_spec: "{{ create_additional_image_builder_hosts_survey }}"

    workflow_nodes:

      #########################################################################
      # Create AWS instances
      #########################################################################

      - identifier: "create_additional_image_builder_hosts"

        unified_job_template:
          name: "IM | ADD-BUILDERS | 10 | JT | Create AWS instances"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "populate_staged_image_builder_inventory"

      #########################################################################
      # Populate staged inventory
      #########################################################################

      - identifier: "populate_staged_image_builder_inventory"

        unified_job_template:
          name: "IM | ADD-BUILDERS | 20 | JT | Populate staged inventory"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "enroll_additional_image_builders_in_idm"

      #########################################################################
      # Enroll staged hosts in IdM
      #########################################################################

      - identifier: "enroll_additional_image_builders_in_idm"

        unified_job_template:
          name: "IM | ADD-BUILDERS | 30 | JT | Enroll hosts in IdM"
          organization:
            name: "Image Mode Lab"
          type: "job_template"

        related:
          success_nodes:
            - identifier: "generate_certs_in_aws_for_builders"

      #########################################################################
      # Generate Certs in AWS - Download to Builder Hosts 
      #########################################################################

      - identifier: "generate_certs_in_aws_for_builders"

        unified_job_template:
          name: "IM | ADD-BUILDERS | 40 | JT | Generate AWS certificates"
          organization:
            name: "Image Mode Lab"
          type: "job_template"
        related:
          success_nodes:
            - identifier: "activate_staged_builders_in_satellite"

      #########################################################################
      # Activate Staged Image Builder Hosts in Satellite
      #########################################################################

      - identifier: "activate_staged_builders_in_satellite"

        unified_job_template:
          name: "IM | ADD-BUILDERS | 50 | JT | Activate hosts in Satellite"
          organization:
            name: "Image Mode Lab"
          type: "job_template"
        related:
          success_nodes:
            - identifier: "configure_additional_staged_builders"

    #########################################################################
    # Configure additional staged Image Mode Builder hosts
    #########################################################################

      - identifier: "configure_additional_staged_builders"

        unified_job_template:
          name: "IM | ADD-BUILDERS | 60 | JT | Configure staged builders"
          organization:
            name: "Image Mode Lab"
          type: "job_template"
        related:
          success_nodes:
            - identifier: "promote_new_image_builder_hosts"
            - identifier: "create_image_builder_teams_and_groups"

      #########################################################################
      # Create Image Builder teams and inventory groups
      #########################################################################

      - identifier: "create_image_builder_teams_and_groups"
        unified_job_template:
          name: "IM | ADD-BUILDERS | 70A | JT | Create teams and groups"
          organization:
            name: "Image Mode Lab"
          type: "job_template"


    #########################################################################
    # Configure additional staged Image Mode Builder hosts
    #########################################################################

      - identifier: "promote_new_image_builder_hosts"

        unified_job_template:
          name: "IM | ADD-BUILDERS | 70B | JT | Promote builder hosts"
          organization:
            name: "Image Mode Lab"
          type: "job_template"
        related:
          success_nodes:
            - identifier: "clear_promoted_builders_from_staged_inventory"



    #########################################################################
    # Clear inventory out
    #########################################################################

      - identifier: "clear_promoted_builders_from_staged_inventory"

        unified_job_template:
          name: "IM | ADD-BUILDERS | 80 | JT | Clear staged inventory"
          organization:
            name: "Image Mode Lab"
          type: "job_template"



