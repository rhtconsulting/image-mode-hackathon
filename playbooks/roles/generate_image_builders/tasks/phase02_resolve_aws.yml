---
###############################################################################
# PHASE 02
#
# Discover the existing lab environment from AWS.
#
# Terraform has already completed and its outputs are no longer available.
# Existing AWS resources therefore become the source of truth.
###############################################################################

- name: PHASE 02 | Resolve AWS caller identity
  amazon.aws.aws_caller_info:
  register: image_builder_aws_caller


- name: PHASE 02 | Store AWS account information
  ansible.builtin.set_fact:
    image_builder_aws_account_id: "{{ image_builder_aws_caller.account }}"
    image_builder_aws_caller_arn: "{{ image_builder_aws_caller.arn }}"


###############################################################################
# Discover IdM anchor instance
###############################################################################

- name: PHASE 02 | Discover IdM anchor instance
  amazon.aws.ec2_instance_info:
    region: "{{ image_builder_aws_region }}"
    filters:
      "tag:Name": "idm-1.*"
      instance-state-name:
        - running
  register: image_builder_idm_instance_info


- name: PHASE 02 | Validate IdM anchor discovery
  ansible.builtin.assert:
    that:
      - image_builder_idm_instance_info.instances | length == 1
    fail_msg: >-
      Expected exactly one running IdM anchor instance matching
      idm-1.*, but found
      {{ image_builder_idm_instance_info.instances | length }}.

      The Image Builder provisioning workflow cannot safely determine
      the lab VPC and domain without a unique anchor instance.


###############################################################################
# Resolve anchor information
###############################################################################

- name: PHASE 02 | Resolve IdM anchor facts
  ansible.builtin.set_fact:
    image_builder_idm_instance: >-
      {{ image_builder_idm_instance_info.instances[0] }}

    image_builder_idm_fqdn: >-
      {{
        image_builder_idm_instance_info.instances[0].tags.Name
      }}

    image_builder_vpc_id: >-
      {{
        image_builder_idm_instance_info.instances[0].vpc_id
      }}


###############################################################################
# Calculate lab domain
#
# Example:
#
# idm-1.lab.sandbox2233.opentlc.com
#
# becomes:
#
# lab.sandbox2233.opentlc.com
###############################################################################

- name: PHASE 02 | Calculate lab domain from IdM hostname
  ansible.builtin.set_fact:
    image_builder_domain_name: >-
      {{
        image_builder_idm_fqdn
        | regex_replace('^idm-1\\.', '')
      }}


###############################################################################
# Validation
###############################################################################

- name: PHASE 02 | Validate calculated lab domain
  ansible.builtin.assert:
    that:
      - image_builder_domain_name | length > 0
      - image_builder_domain_name != image_builder_idm_fqdn
      - image_builder_domain_name is match('^[A-Za-z0-9.-]+$')
    fail_msg: >-
      Unable to calculate a valid lab domain from IdM hostname
      {{ image_builder_idm_fqdn }}.


###############################################################################
# Results
###############################################################################

- name: PHASE 02 | Display discovered lab context
  ansible.builtin.debug:
    msg:
      - "AWS account: {{ image_builder_aws_account_id }}"
      - "AWS region: {{ image_builder_aws_region }}"
      - "Anchor host: {{ image_builder_idm_fqdn }}"
      - "Lab domain: {{ image_builder_domain_name }}"
      - "Lab VPC: {{ image_builder_vpc_id }}"