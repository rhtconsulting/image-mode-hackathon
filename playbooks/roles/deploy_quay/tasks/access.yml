---
###############################################################################
# Enable LDAP synchronization for Quay teams
#
# Synchronize the owners team last. Synchronizing owners can remove the
# bootstrap administrator and revoke the API token's organization permissions.
###############################################################################

- name: Build safe Quay team synchronization order
  ansible.builtin.set_fact:
    quay_team_syncs_ordered: >-
      {{
        (
          quay_team_syncs
          | rejectattr('team', 'equalto', quay_owner_team)
          | list
        )
        +
        (
          quay_team_syncs
          | selectattr('team', 'equalto', quay_owner_team)
          | list
        )
      }}

- name: Validate Quay team synchronization order
  ansible.builtin.assert:
    that:
      - quay_team_syncs_ordered | length == quay_team_syncs | length
      - quay_team_syncs_ordered | length > 0
      - quay_team_syncs_ordered[-1].team == quay_owner_team
    fail_msg: >-
      Unable to build a safe Quay synchronization order. The owners team
      must exist and must be synchronized last.

- name: Display Quay team synchronization order
  ansible.builtin.debug:
    msg: >-
      Quay LDAP teams will be synchronized in this order:
      {{
        quay_team_syncs_ordered
        | map(attribute='team')
        | join(' -> ')
      }}

- name: Enable LDAP synchronization for Quay teams
  ansible.builtin.uri:
    url: >-
      https://127.0.0.1:{{ quay_https_port
      }}/api/v1/organization/{{ quay_default_org
      }}/team/{{ item.team }}/syncing
    method: POST
    validate_certs: false
    headers:
      Authorization: "Bearer {{ quay_api_token }}"
      Accept: application/json
    body_format: json
    body:
      group_dn: "{{ item.group_dn }}"
    status_code:
      - 200
      - 201
      - 204
    return_content: true
  loop: "{{ quay_team_syncs_ordered }}"
  loop_control:
    label: "{{ item.team }}"
  register: quay_enable_team_sync
  changed_when: quay_enable_team_sync.status in [200, 201, 204]
  no_log: true

- name: Report enabled Quay LDAP team synchronization
  ansible.builtin.debug:
    msg:
      team: "{{ item.item.team }}"
      role: "{{ item.item.role }}"
      idm_group: "{{ item.item.idm_group }}"
      group_dn: "{{ item.item.group_dn }}"
      api_status: "{{ item.status }}"
  loop: "{{ quay_enable_team_sync.results }}"
  loop_control:
    label: "{{ item.item.team }}"

###############################################################################
# Report deployment result
###############################################################################

- name: Display deployment result
  ansible.builtin.debug:
    msg:
      - "Quay URL: https://{{ quay_hostname }}"
      - "Authentication: IdM LDAP"
      - "IdM base DN: {{ idm_base_dn }}"
      - "IdM user container: {{ idm_user_container_dn }}"
      - "IdM owner group: {{ quay_idm_owner_group_dn }}"
      - "IdM member group: {{ quay_idm_member_group_dn }}"
      - "IdM writer group: {{ quay_idm_writer_group_dn }}"
      - "Organization: {{ quay_default_org }}"
      - "Owner team: {{ quay_owner_team }}"
      - "Member team: {{ quay_default_team }}"
      - "Writer team: {{ quay_writer_team }}"
      - >-
        PostgreSQL data is retained at
        {{ quay_root }}/postgres with UID/GID 26.
      - >-
        Quay configuration is owned by container UID
        {{ quay_container_uid }} with mode 0640.
      - >-
        LDAP users are created in Quay on their first successful
        LDAP login.
      - >-
        IdM group synchronization controls Quay team membership,
        and members of the IdM owner group become Quay superusers.
      - >-
        Dedicated Quay LDAP user:
        {{ quay_registry_ldap_username }}
      - >-
        Dedicated Quay LDAP credential secret:
        {{ quay_registry_ldap_secret_name }}
      - >-
        The dedicated Quay LDAP user belongs to the
        {{ quay_idm_writer_group }} IdM group, which synchronizes to the
        {{ quay_writer_team }} Quay team.

- name: Show running containers
  ansible.builtin.command:
    argv:
      - podman
      - ps
  register: podman_ps
  changed_when: false

- name: Display running containers
  ansible.builtin.debug:
    var: podman_ps.stdout_lines